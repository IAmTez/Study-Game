<title>Sewers of Study</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Sewers of Study — illustrated fantasy UI theme

   Cinzel (carved Roman capitals) for titles, buttons and labels; Nunito, a
   rounded and very readable sans, for everything you actually read. Panels
   are soft, layered gradients with a thin bright rim, so the vector art sits
   in a frame that matches it.
   ============================================================ */

:root {
  --ink:        #080b10;
  --stone-900:  #0f141c;
  --stone-800:  #151c27;
  --stone-700:  #1c2533;
  --stone-600:  #283346;
  --stone-500:  #3a485f;
  --stone-400:  #5b6d8a;
  --slime:      #6fd68a;
  --slime-dark: #1f6b45;
  --sewer:      #3f7a5a;
  --gold:       #f0c75e;
  --gold-dark:  #9a7420;
  --blood:      #e0565c;
  --blood-dark: #6e1f2a;
  --mana:       #66b3f0;
  --mana-dark:  #1f4f80;
  --energy:     #f4a63c;
  --parchment:  #f1e6c8;
  --parchment-2:#c9b98d;
  --text:       #e9e6dd;
  --text-dim:   #9ba6b6;

  --rar-common:    #c3cbd6;
  --rar-uncommon:  #6fd68a;
  --rar-rare:      #5aa8f4;
  --rar-epic:      #b77ff0;
  --rar-legendary: #f6a843;

  --radius: 14px;
  --radius-sm: 9px;
  --rim: rgba(255, 236, 190, 0.12);
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
  --px: 2px;

  --font-display: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Georgia, serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body.reduce-motion * { animation: none !important; transition: none !important; }
body.font-large { font-size: 20px; }
body.font-small { font-size: 15px; }

#app {
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(80, 120, 140, .22), transparent 70%),
    radial-gradient(900px 500px at 10% 110%, rgba(60, 110, 80, .16), transparent 70%),
    linear-gradient(180deg, #0d131b 0%, #080b10 100%);
}

canvas.art { display: block; }

/* ---------- Boot ---------- */
.boot { text-align: center; }
.boot-title { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--gold); letter-spacing: 3px; }
.boot-sub { margin-top: 1rem; color: var(--text-dim); }

/* ---------- Screen shell ---------- */
.screen {
  width: min(1460px, 100vw - 16px);
  height: calc(100vh - 16px);
  display: flex;
  flex-direction: column;
  position: relative;
}

.screen-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }

/* ---------- Panels ---------- */
.panel {
  background:
    linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 40%),
    linear-gradient(180deg, var(--stone-800), #121823);
  border: 1px solid var(--stone-600);
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 1px 0 var(--rim);
  padding: 16px 18px;
  position: relative;
}

.panel--dark  { background: linear-gradient(180deg, var(--stone-900), #0b1017); }
.panel--fill  { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.panel--flush { box-shadow: inset 0 1px 0 var(--rim); }

.panel-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  color: var(--gold);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin: 0 0 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid transparent;
  border-image: linear-gradient(90deg, rgba(240,199,94,.55), rgba(240,199,94,0) 80%) 1;
}

/* ---------- Buttons ---------- */
.btn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .6px;
  color: var(--text);
  background: linear-gradient(180deg, #33415a, #263247);
  border: 1px solid #4a5a76;
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  padding: 11px 16px;
  cursor: pointer;
  text-align: left;
  line-height: 1.35;
  transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
  display: block;
  width: 100%;
}
.btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 5px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.btn--primary { background: linear-gradient(180deg, #2f8f5d, #1f6b45); border-color: #57c68a; }
.btn--danger  { background: linear-gradient(180deg, #a0333c, #6e1f2a); border-color: #e0565c; }
.btn--gold    { background: linear-gradient(180deg, #f6d27a, #c8962c); border-color: #ffe39a; color: #2a1c05; }
.btn--ghost   { background: rgba(255,255,255,.03); border-color: var(--stone-500); box-shadow: none; }
.btn--sm      { padding: 8px 12px; font-size: 13px; }
.btn--inline  { display: inline-block; width: auto; }
.btn--center  { text-align: center; }

.btn-sub { display: block; font-family: var(--font-body); font-weight: 600; font-size: 14px; letter-spacing: 0; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
.btn--gold .btn-sub { color: #4a3608; }
.btn--primary .btn-sub { color: #cdeedd; }

/* ---------- Layout helpers ---------- */
.row  { display: flex; gap: 12px; }
.col  { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; min-height: 0; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.center-x { justify-content: center; }
.center-y { align-items: center; }
.gap-sm { gap: 8px; }
.gap-lg { gap: 20px; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 12px; }
.dim { color: var(--text-dim); }
.small { font-size: 15.5px; }
.tiny { font-size: 13.5px; line-height: 1.5; }
.gold { color: var(--gold); }
.good { color: var(--slime); }
.bad  { color: var(--blood); }
.center { text-align: center; }
.hidden { display: none !important; }

/* ---------- Title screen ---------- */
.title-wrap { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.title-main {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 52px;
  line-height: 1.1;
  letter-spacing: 4px;
  margin: 0;
  background: linear-gradient(180deg, #fff1c4 0%, #f0c75e 45%, #b9842a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 0 rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(240,199,94,.25));
  animation: bob 5s ease-in-out infinite;
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.title-sub { color: var(--slime); font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 4px; text-transform: uppercase; }
.title-tag { color: var(--text-dim); font-size: 17px; max-width: 620px; line-height: 1.6; }

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  width: min(640px, 100%);
}
.menu-grid .span-2 { grid-column: 1 / -1; }

/* ---------- Bars ---------- */
.bar {
  height: 20px;
  background: #0b1017;
  border: 1px solid var(--stone-600);
  border-radius: 999px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
}
.bar-fill { height: 100%; width: 0; border-radius: 999px; transition: width .35s ease; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.bar-fill--hp     { background: linear-gradient(180deg, #ff8a8f, #d23b45); }
.bar-fill--energy { background: linear-gradient(180deg, #ffd27a, #e08a1e); }
.bar-fill--xp     { background: linear-gradient(180deg, #9ad1ff, #3b82d0); }
.bar-fill--enemy  { background: linear-gradient(180deg, #f08a5a, #b2441e); }
.bar-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 12.5px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85);
}
.bar--sm { height: 14px; }
.bar--sm .bar-label { font-size: 11px; }

/* ---------- Battle screen ----------
   Three fixed bands that always add up to the viewport: a slim status strip,
   the scene (which shrinks to whatever is left), and the console. Nothing here
   scrolls, so play never turns into scrolling a web page. */
.battle {
  display: flex; flex-direction: column; gap: 10px;
  height: 100%; min-height: 0;
}

.battle-top {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: linear-gradient(180deg, var(--stone-800), #121823);
  border: 1px solid var(--stone-600);
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 1px 0 var(--rim);
  padding: 8px 10px;
}

.scene-stage {
  /* basis 0, not auto: the canvas is sized *from* this box, so letting the box
     size to its content instead makes the two chase each other and the scene
     collapses to its minimum. */
  flex: 1 1 0; min-height: 190px;
  background: #05070a;
  border: 1px solid var(--stone-600);
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 0 40px rgba(0,0,0,.8);
  position: relative; overflow: hidden;
}
#scene-canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

.battle-console {
  /* Shrinkable: on a short window the console gives way and scrolls its own
     column rather than pushing the page past the viewport. */
  flex: 0 1 auto;
  display: flex; gap: 10px; align-items: stretch;
  max-height: min(54vh, 450px); min-height: 0;
}
.battle-main {
  flex: 1 1 auto; min-width: 0; overflow-y: auto;
  display: flex; flex-direction: column;
}
.battle-main > .panel { flex: 1 1 auto; }
.battle-rail {
  flex: 0 0 250px; display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto;
  /* Without this, a horizontally overflowing child scrolls the whole rail
     sideways — panels and all — instead of just itself. */
  overflow-x: hidden;
}

/* The control strip scrolls on its own axis, so dragging across it moves the
   buttons rather than the section beneath them. */
.rail-tabs {
  flex: 0 0 auto;
  display: flex; gap: 8px;
  overflow-x: auto; overflow-y: hidden;
  padding-bottom: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--stone-500) transparent;
  overscroll-behavior-x: contain;
}
.rail-tabs > .btn { flex: 0 0 auto; }
.rail-tabs::-webkit-scrollbar { height: 6px; }
.rail-tabs::-webkit-scrollbar-track { background: transparent; }
.rail-tabs::-webkit-scrollbar-thumb { background: var(--stone-500); border-radius: 999px; }

/* Item buttons in the rail stay compact so they all fit without scrolling. */
.item-btn { padding: 8px 10px; font-size: 13px; }
.item-btn .btn-sub { font-size: 13px; margin-top: 3px; }

.hud-strip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hud-chip {
  background: rgba(8, 11, 16, .55);
  border: 1px solid var(--stone-600);
  border-radius: 999px;
  padding: 5px 12px;
  font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .4px;
  white-space: nowrap;
}

.log {
  height: 116px; overflow-y: auto;
  background: #0b1017;
  border: 1px solid var(--stone-600);
  border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 14.5px; line-height: 1.5;
}
.log-line { color: var(--text-dim); }
.log-line--good { color: var(--slime); }
.log-line--bad  { color: var(--blood); }
.log-line--gold { color: var(--gold); }
.log-line--info { color: var(--mana); }

/* ---------- Question card ---------- */
.q-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.q-card {
  background: linear-gradient(180deg, #223047, #1a2435);
  border: 1px solid var(--stone-500);
  border-radius: var(--radius-sm);
  padding: 12px 14px; cursor: pointer; text-align: left;
  font-family: var(--font-body); font-size: 15.5px; color: var(--text);
  transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 3px 0 rgba(0,0,0,.3);
}
.q-card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 8px 18px rgba(0,0,0,.4), 0 0 0 1px rgba(240,199,94,.25); }
.q-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.q-card.is-selected { border-color: var(--gold); }
.q-card-subject { color: var(--gold); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .4px; }
.q-card-topic { color: var(--text-dim); font-size: 14.5px; line-height: 1.4; }
.q-card-meta { margin-top: auto; display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; }

.q-prompt {
  white-space: pre-line;
  font-size: 19px; line-height: 1.55; color: var(--parchment);
  background: linear-gradient(180deg, rgba(240,199,94,.06), rgba(240,199,94,0)), #0d131b;
  border: 1px solid rgba(240,199,94,.25);
  border-left: 3px solid var(--gold);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
}
.q-stimulus {
  margin: 0; padding: 10px 14px; overflow-x: auto;
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.45;
  color: var(--text); background: #0b1017; border: 1px solid var(--stone-500); border-radius: var(--radius-sm);
}
.q-source {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 800; letter-spacing: .03em; white-space: nowrap;
  color: #2a1c05; background: linear-gradient(180deg, #f6d27a, #d9a640);
  box-shadow: 0 1px 0 rgba(0,0,0,.4);
}
.q-card .q-source { align-self: flex-start; }
.opt-list { display: grid; gap: 8px; margin-top: 12px; }
.opt {
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  text-align: left; padding: 11px 14px;
  background: linear-gradient(180deg, #212d41, #1a2434); color: var(--text);
  border: 1px solid var(--stone-500); border-radius: var(--radius-sm); cursor: pointer;
  display: flex; gap: 12px; align-items: flex-start;
  transition: border-color .12s ease, background .12s ease, transform .12s ease;
}
.opt:hover:not(:disabled) { border-color: var(--gold); transform: translateX(2px); background: linear-gradient(180deg, #273650, #1e2a3d); }
.opt:disabled { cursor: not-allowed; }
.opt-key {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  color: #2a1c05; background: linear-gradient(180deg, #f6d27a, #d9a640);
}
.opt--correct { background: linear-gradient(180deg, #2a7a52, #1f6b45); border-color: var(--slime); }
.opt--wrong   { background: linear-gradient(180deg, #8a2a35, #6e1f2a); border-color: var(--blood); }
.opt--gone    { opacity: .25; text-decoration: line-through; }

.short-input {
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  width: 100%; padding: 12px; min-height: 84px; resize: vertical;
  background: #0b1017; color: var(--text);
  border: 1px solid var(--stone-500); border-radius: var(--radius-sm);
}
.short-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(240,199,94,.15); }

.explain {
  background: linear-gradient(180deg, rgba(111,214,138,.08), rgba(111,214,138,.03));
  border: 1px solid rgba(111,214,138,.35);
  border-radius: var(--radius-sm);
  padding: 12px 15px; font-size: 15.5px; line-height: 1.55; color: #d6ebdc;
}
.explain b { color: var(--slime); }

/* ---------- Items ---------- */
.inv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 10px;
}
.slot {
  aspect-ratio: 1; position: relative; cursor: pointer;
  background: radial-gradient(circle at 50% 40%, #223047, #121a26 75%);
  border: 1px solid var(--stone-600);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  padding: 0;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.slot:hover { border-color: var(--gold); transform: translateY(-2px); }
.slot.is-selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(240,199,94,.35); }
.slot-count {
  position: absolute; right: 5px; bottom: 3px;
  font-weight: 800; font-size: 13px; color: #fff; text-shadow: 0 1px 2px #000;
}
.slot-equipped {
  position: absolute; left: 4px; top: 4px;
  font-size: 10px; font-weight: 800; letter-spacing: .5px;
  padding: 1px 5px; border-radius: 999px;
  color: #2a1c05; background: linear-gradient(180deg, #f6d27a, #d9a640);
}
.slot--empty { cursor: default; opacity: .55; }
.slot--empty:hover { border-color: var(--stone-600); transform: none; }

.rar-common    { color: var(--rar-common); }
.rar-uncommon  { color: var(--rar-uncommon); }
.rar-rare      { color: var(--rar-rare); }
.rar-epic      { color: var(--rar-epic); }
.rar-legendary { color: var(--rar-legendary); }
.b-common    { border-color: rgba(195,203,214,.45) !important; }
.b-uncommon  { border-color: var(--rar-uncommon) !important; }
.b-rare      { border-color: var(--rar-rare) !important; box-shadow: inset 0 0 14px rgba(90,168,244,.18); }
.b-epic      { border-color: var(--rar-epic) !important; box-shadow: inset 0 0 16px rgba(183,127,240,.22); }
.b-legendary { border-color: var(--rar-legendary) !important; box-shadow: inset 0 0 18px rgba(246,168,67,.28), 0 0 10px rgba(246,168,67,.25); }

/* ---------- Paper doll ---------- */
.doll {
  display: grid;
  grid-template-columns: 76px 1fr 76px;
  gap: 8px;
  align-items: center;
}
.doll-col { display: flex; flex-direction: column; gap: 8px; }
.doll-figure {
  position: relative; display: flex; justify-content: center; align-items: flex-end;
  min-height: 250px;
  background:
    radial-gradient(closest-side at 50% 60%, rgba(240,199,94,.12), transparent),
    radial-gradient(ellipse at 50% 95%, rgba(0,0,0,.6), transparent 60%);
  border-radius: var(--radius);
}
.doll-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
.doll-slot {
  position: relative; aspect-ratio: 1;
  background: radial-gradient(circle at 50% 40%, #1f2b3f, #111823 75%);
  border: 1px dashed var(--stone-500);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
  transition: border-color .12s ease, transform .12s ease;
}
.doll-slot.is-filled { border-style: solid; }
.doll-slot:hover:not(.is-locked) { border-color: var(--gold); transform: translateY(-1px); }
.doll-slot.is-target { border-color: var(--slime); box-shadow: 0 0 0 2px rgba(111,214,138,.35); }
.doll-slot.is-locked { cursor: not-allowed; opacity: .45; }
.doll-slot-label {
  position: absolute; left: 0; right: 0; bottom: 2px; text-align: center;
  font-size: 9.5px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--text-dim);
  pointer-events: none;
}
.doll-slot.is-filled .doll-slot-label { display: none; }
.doll-lock { font-size: 11px; font-weight: 800; color: var(--text-dim); text-align: center; line-height: 1.2; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 14px; }
.stat-grid .stat-row { padding: 4px 0; font-size: 14px; }

/* ---------- Tables / stats ---------- */
.stat-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--stone-700); font-size: 15.5px;
}
.stat-row:last-child { border-bottom: 0; }
.stat-row span:last-child { color: var(--gold); white-space: nowrap; font-weight: 700; }

.subject-card {
  background: linear-gradient(180deg, #172131, #111823);
  border: 1px solid var(--stone-600);
  border-radius: var(--radius-sm);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
}

/* ---------- Forms ---------- */
label.field { display: block; font-size: 15px; margin-bottom: 6px; color: var(--text-dim); }
input[type=text], input[type=number], select, textarea {
  font-family: var(--font-body); font-size: 16px;
  background: #0b1017; color: var(--text);
  border: 1px solid var(--stone-500); border-radius: var(--radius-sm); padding: 10px; width: 100%;
}
input[type=range] { width: 100%; accent-color: var(--gold); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }

.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15.5px; padding: 6px 0; }

        poly(ctx, [[x, 0], [x + 6, -7 + Math.abs(x - 40) * 0.12]], false); line(ctx, shade(blade, -0.3), 1);
      }
      poly(ctx, [[2, 0], [68, 0]], false); line(ctx, shade(blade, -0.45), 1.2);
      break;
    }
    case 'axe': {
      limb(ctx, [[-26, 0], [60, 0]], 5, hilt, { outline: 1.8 });
      smooth(ctx, [[40, -4], [46, -24], [62, -28], [58, -10], [60, 8], [56, 26], [44, 22], [40, 4]]);
      paint(ctx, blade, -28, 26, { line: 2, light: 0.35 });
      smooth(ctx, [[58, -24], [57, 0], [54, 22]], false); line(ctx, rgba(look.glow || '#ffffff', 0.7), 1.6);
      break;
    }
    case 'sword':
    default: {
      limb(ctx, [[-13, 0], [0, 0]], 5, hilt, { outline: 1.8 });
      circlePath(ctx, -14, 0, 3.2); paint(ctx, '#c9a227', -3, 3, { line: 1.4 });
      roundRectPath(ctx, -2, -9, 4.5, 18, 2); paint(ctx, look.glow ? '#c9a227' : shade(hilt, 0.2), -9, 9, { line: 1.6 });
      poly(ctx, [[2, -3.6], [56, -3], [64, 0], [56, 3], [2, 3.6]]);
      paint(ctx, blade, -4, 4, { line: 1.8, light: 0.3 });
      poly(ctx, [[5, 0], [55, 0]], false); line(ctx, shade(blade, -0.25), 1);
      poly(ctx, [[5, -1.8], [52, -1.4]], false); line(ctx, 'rgba(255,255,255,.55)', 0.9);
      break;
    }
  }
}

/* ---------------------------------------------------------------
   Shields — centred on the hand, facing the viewer
   --------------------------------------------------------------- */

function drawShield(ctx, look) {
  const c = look.colour || '#8f969e';
  const trim = look.trim || shade(c, -0.3);
  if (look.glow) glow(ctx, 0, 0, 40, look.glow, 0.35);
  switch (look.shape) {
    case 'grate': {
      roundRectPath(ctx, -17, -21, 34, 42, 6); paint(ctx, c, -21, 21, { line: 2.4 });
      for (const x of [-8, 0, 8]) { poly(ctx, [[x, -18], [x, 18]], false); line(ctx, shade(c, -0.45), 2.2); }
      for (const y of [-10, 0, 10]) { poly(ctx, [[-14, y], [14, y]], false); line(ctx, shade(c, -0.45), 2.2); }
      roundRectPath(ctx, -17, -21, 34, 42, 6); line(ctx, trim, 3);
      break;
    }
    case 'kite':
    case 'aegis': {
      const pts = [[-16, -22], [16, -22], [18, -6], [0, 26], [-18, -6]];
      smooth(ctx, pts, true, 0.25);
      paint(ctx, c, -22, 26, { line: 2.6, light: 0.22 });
      smooth(ctx, [[-12, -18], [12, -18], [13, -6], [0, 19], [-13, -6]], true, 0.25); line(ctx, trim, 2.2);
      if (look.shape === 'aegis') {
        glow(ctx, 0, -2, 14, look.glow || '#6fb4ff', 0.8);
        poly(ctx, [[0, -12], [7, -2], [0, 10], [-7, -2]]); paint(ctx, look.glow || '#6fb4ff', -12, 10, { line: 1.4, ink: trim, light: 0.5 });
      } else {
        poly(ctx, [[0, -18], [0, 18]], false); line(ctx, trim, 3.4);
        poly(ctx, [[-13, -6], [13, -6]], false); line(ctx, trim, 3.4);
      }
      gloss(ctx, -3, -8, 12, 12, 0.4);
      break;
    }
    case 'tower': {
      smooth(ctx, [[-17, -24], [0, -29], [17, -24], [17, 24], [-17, 24]], true, 0.2);
      paint(ctx, c, -29, 24, { line: 2.6 });
      for (const [x, y, r] of [[-9, -12, 4], [6, -4, 3], [-4, 8, 5], [9, 14, 3], [-11, 17, 3], [10, -16, 2.5]]) {
        circlePath(ctx, x, y, r); paint(ctx, trim, y - r, y + r, { line: 1.2 });
        circlePath(ctx, x, y, r * 0.4); ctx.fillStyle = shade(c, -0.5); ctx.fill();
      }
      break;
    }
    case 'round':
    default: {
      circlePath(ctx, 0, 0, 19); paint(ctx, c, -19, 19, { line: 2.4, light: 0.3 });
      circlePath(ctx, 0, 0, 15.5); line(ctx, trim, 1.6);
      circlePath(ctx, 0, 0, 5); paint(ctx, shade(c, 0.2), -5, 5, { line: 1.6 });
      gloss(ctx, -2, -2, 13, 13, 0.45);
      break;
    }
  }
}

/* ---------------------------------------------------------------
   Head pieces
   --------------------------------------------------------------- */

function drawHair(ctx, look, behind) {
  const { x, y, r } = HEAD;
  const hair = look.hair;
  const style = look.head?.style;
  if (behind) {
    if (style === 'long') {
      smooth(ctx, [[x - 14, y - 12], [x - 22, y + 8], [x - 20, y + 30], [x - 6, y + 34], [x + 2, y + 14]]);
      paint(ctx, hair, y - 12, y + 34, { line: 2.2 });
    }
    return;
  }
  if (style === 'messy') {
    smooth(ctx, [[x - 22, y + 2], [x - 24, y - 12], [x - 16, y - 24], [x - 4, y - 27], [x + 4, y - 30], [x + 12, y - 24],
      [x + 22, y - 20], [x + 20, y - 10], [x + 10, y - 12], [x - 2, y - 10], [x - 10, y - 4], [x - 14, y + 6]]);
  } else if (style === 'long') {
    smooth(ctx, [[x - 22, y + 4], [x - 22, y - 14], [x - 10, y - 25], [x + 8, y - 25], [x + 22, y - 12], [x + 18, y - 8],
      [x + 4, y - 14], [x - 8, y - 8], [x - 14, y + 8]]);
  } else {
    smooth(ctx, [[x - 22, y + 2], [x - 21, y - 14], [x - 8, y - 24], [x + 10, y - 23], [x + 22, y - 12], [x + 16, y - 9],
      [x + 2, y - 12], [x - 10, y - 6], [x - 14, y + 6]]);
  }
  paint(ctx, hair, y - 28, y + 6, { line: 2.2, light: 0.22 });
  gloss(ctx, x - 2, y - 14, 12, 7, 0.25);
  if (look.head?.circlet) {
    ctx.beginPath(); ctx.ellipse(x, y - 9, r - 1, 5, 0, Math.PI * 0.05, Math.PI * 0.95, true); line(ctx, look.head.circlet, 2.4);
    circlePath(ctx, x + 6, y - 14, 2.6); paint(ctx, '#e0607e', y - 17, y - 11, { line: 1 });
  }
}

function drawFace(ctx, look, covered) {
  const { x, y } = HEAD;
  if (!covered.eyes) {
    eye(ctx, x + 11, y - 2, 3.1, '#2a3550');
    poly(ctx, [[x + 7, y - 9], [x + 15, y - 9.5]], false); line(ctx, shade(look.hair, -0.2), 1.8);
  }
  if (!covered.mouth) {
    // Nose and a small determined mouth.
    smooth(ctx, [[x + 19, y - 1], [x + 22, y + 4], [x + 18, y + 5]], false); line(ctx, shade(look.skin, -0.35), 1.4);
    ctx.beginPath(); ctx.moveTo(x + 12, y + 11); ctx.quadraticCurveTo(x + 15, y + 12.5, x + 18, y + 10); line(ctx, '#7a3f35', 1.5);
    // A touch of colour in the cheek.
    ellipsePath(ctx, x + 9, y + 5, 3.5, 2.2); ctx.fillStyle = rgba('#e0607e', 0.25); ctx.fill();
  }
  if (look.glasses && !covered.eyes) {
    circlePath(ctx, x + 12, y - 2, 5.2); line(ctx, '#3a2a1e', 1.6);
    ctx.fillStyle = 'rgba(200,230,255,.18)'; ctx.fill();
    poly(ctx, [[x + 6.8, y - 3], [x - 4, y - 5]], false); line(ctx, '#3a2a1e', 1.4);
  }
  if (look.mask && !covered.mouth) {
    smooth(ctx, [[x - 4, y + 2], [x + 10, y + 1], [x + 22, y + 2], [x + 20, y + 13], [x + 8, y + 18], [x - 4, y + 14]]);
    paint(ctx, look.mask, y + 1, y + 18, { line: 1.8 });
  }
  if (look.beard && !covered.mouth) {
    smooth(ctx, [[x - 2, y + 4], [x + 10, y + 8], [x + 21, y + 6], [x + 20, y + 20], [x + 10, y + 36], [x + 2, y + 24]]);
    paint(ctx, look.beard, y + 4, y + 36, { line: 1.8, light: 0.1 });
    ctx.beginPath(); ctx.moveTo(x + 12, y + 11); ctx.quadraticCurveTo(x + 15, y + 12, x + 18, y + 10); line(ctx, '#7a5a50', 1.4);
  }
}

/** Role headgear (no helmet equipped). */
function drawRoleHat(ctx, look) {
  const { x, y, r } = HEAD;
  const head = look.head || {};
  if (head.type === 'wizard') {
    smooth(ctx, [[x - 20, y - 12], [x - 10, y - 30], [x - 6, y - 52], [x - 18, y - 70], [x - 2, y - 58], [x + 10, y - 34], [x + 22, y - 14]]);
    paint(ctx, head.colour, y - 70, y - 12, { line: 2.4, light: 0.2 });
    ellipsePath(ctx, x + 1, y - 13, 32, 6.5, -0.06); paint(ctx, shade(head.colour, -0.08), y - 19, y - 7, { line: 2.4 });
    ctx.beginPath(); ctx.ellipse(x + 1, y - 17, 20, 4, -0.06, Math.PI * 0.05, Math.PI * 0.95); line(ctx, head.band, 3);
    for (const [sx, sy] of [[x - 2, y - 40], [x + 4, y - 28]]) {
      poly(ctx, [[sx, sy - 3], [sx + 1, sy - 1], [sx + 3, sy], [sx + 1, sy + 1], [sx, sy + 3], [sx - 1, sy + 1], [sx - 3, sy], [sx - 1, sy - 1]]);
      ctx.fillStyle = head.band; ctx.fill();
    }
    return { eyes: false, mouth: false, hair: 'sides' };
  }
  if (head.type === 'hood') {
    smooth(ctx, [[x - 24, y + 14], [x - 26, y - 6], [x - 18, y - 24], [x, y - 30], [x + 18, y - 24], [x + 26, y - 6],
      [x + 22, y + 10], [x + 14, y + 4], [x + 8, y - 16], [x - 6, y - 14], [x - 8, y + 6], [x - 4, y + 22], [x - 18, y + 24]]);
    paint(ctx, head.colour, y - 30, y + 24, { line: 2.4, light: 0.2 });
    gloss(ctx, x - 6, y - 12, 15, 14, 0.2);
    if (head.leaves) {
      for (const [lx, ly, a] of [[x - 14, y - 26, -0.8], [x - 2, y - 32, -0.2], [x + 10, y - 30, 0.4], [x - 22, y - 14, -1.3]]) {
        withTransform(ctx, lx, ly, a, 1, () => {
          smooth(ctx, [[0, 0], [5, -6], [0, -14], [-5, -6]]);
          paint(ctx, head.leaves, -14, 0, { line: 1.4 });
          poly(ctx, [[0, 0], [0, -12]], false); line(ctx, shade(head.leaves, -0.4), 0.8);
        });
      }
    }
    return { eyes: false, mouth: false, hair: 'none' };
  }
  return null;
}

/** An equipped helmet. Returns which parts of the face it covers. */
function drawHelmet(ctx, look, role) {
  const { x, y, r } = HEAD;
  const c = look.colour || '#8f969e';
  const trim = look.trim || shade(c, -0.3);
  if (look.glow) glow(ctx, x, y - 16, 30, look.glow, 0.35);
  switch (look.shape) {
    case 'cap': {
      smooth(ctx, [[x - 23, y - 2], [x - 20, y - 20], [x, y - 28], [x + 20, y - 20], [x + 23, y - 4]]);
      paint(ctx, c, y - 28, y - 2, { line: 2.4, light: 0.25 });
      poly(ctx, [[x + 14, y - 6], [x + 32, y - 3], [x + 30, y + 1], [x + 12, y - 1]]); paint(ctx, trim, y - 6, y + 1, { line: 1.8 });
      circlePath(ctx, x + 14, y - 16, 5); paint(ctx, '#ece6d6', y - 21, y - 11, { line: 1.6, ink: trim });
      gloss(ctx, x - 4, y - 14, 14, 10, 0.35);
      return { eyes: false, mouth: false, hair: 'sides' };
    }
    case 'hood': {
      drawRoleHat(ctx, { head: { type: 'hood', colour: c } });
      ctx.beginPath(); ctx.arc(x + 4, y - 4, 19, -Math.PI * 0.95, -Math.PI * 0.1); line(ctx, trim, 2);
      return { eyes: false, mouth: false, hair: 'none' };
    }
    case 'helm': {
      smooth(ctx, [[x - 24, y + 6], [x - 23, y - 16], [x - 8, y - 28], [x + 10, y - 27], [x + 23, y - 14], [x + 24, y - 2],
        [x + 16, y - 6], [x - 6, y - 4], [x - 8, y + 10]]);
      paint(ctx, c, y - 28, y + 10, { line: 2.4, light: 0.3 });
      roundRectPath(ctx, x + 15, y - 8, 4.5, 18, 2); paint(ctx, shade(c, -0.1), y - 8, y + 10, { line: 1.6 });
      for (const [rx, ry] of [[x - 14, y - 18], [x - 2, y - 24], [x + 10, y - 22], [x - 18, y - 4]]) {
        circlePath(ctx, rx, ry, 1.6); ctx.fillStyle = trim; ctx.fill();
      }
      gloss(ctx, x - 4, y - 14, 16, 12, 0.45);
      return { eyes: false, mouth: false, hair: 'none' };
    }
    case 'greathelm': {
      roundRectPath(ctx, x - 23, y - 26, 47, 50, 12); paint(ctx, c, y - 26, y + 24, { line: 2.6, light: 0.3 });
      roundRectPath(ctx, x + 2, y - 6, 22, 5, 2.5); ctx.fillStyle = '#0d1017'; ctx.fill();
      for (let i = 0; i < 3; i++) { circlePath(ctx, x + 14 + i * 3, y + 8, 1); ctx.fillStyle = '#0d1017'; ctx.fill(); }
      smooth(ctx, [[x - 10, y - 26], [x - 4, y - 40], [x + 8, y - 44], [x + 2, y - 30]]); paint(ctx, trim, y - 44, y - 26, { line: 1.8 });
      poly(ctx, [[x + 1, y - 24], [x + 1, y + 22]], false); line(ctx, trim, 2);
      gloss(ctx, x - 6, y - 8, 16, 18, 0.4);
      return { eyes: true, mouth: true, hair: 'none' };
    }
    case 'crown': {
      poly(ctx, [[x - 18, y - 14], [x - 20, y - 32], [x - 10, y - 22], [x - 2, y - 36], [x + 6, y - 22], [x + 16, y - 34], [x + 18, y - 14]]);
      paint(ctx, c, y - 36, y - 14, { line: 2.2, light: 0.35 });
      for (const [gx, gy] of [[x - 9, y - 18], [x + 1, y - 18], [x + 11, y - 18]]) {
        circlePath(ctx, gx, gy, 2.6); paint(ctx, trim, gy - 3, gy + 3, { line: 1 });
      }
      return { eyes: false, mouth: false, hair: 'all' };
    }
    case 'diving': {
      circlePath(ctx, x + 2, y - 2, 29); paint(ctx, c, y - 31, y + 27, { line: 2.8, light: 0.3 });
      circlePath(ctx, x + 12, y, 13); paint(ctx, look.trim || '#7fd1c7', y - 13, y + 13, { line: 3, ink: shade(c, -0.5), light: 0.5, alpha: 0.85 });
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        circlePath(ctx, x + 12 + Math.cos(a) * 16, Math.sin(a) * 16 + y, 1.6); ctx.fillStyle = shade(c, -0.5); ctx.fill();
      }
      gloss(ctx, x - 6, y - 10, 20, 18, 0.4);
      gloss(ctx, x + 10, y - 3, 8, 8, 0.6);
      return { eyes: true, mouth: true, hair: 'none', porthole: true };
    }
    default:
      return { eyes: false, mouth: false, hair: 'all' };
  }
}

/* ---------------------------------------------------------------
   Body pieces
   --------------------------------------------------------------- */

function drawBack(ctx, look, sway) {
  const back = look.back;
  if (!back) return;
  if (back.type === 'cape') {
    smooth(ctx, [[-16, -106], [8, -106], [2, -80], [-6, -40], [-20 + sway, -14], [-34 + sway, -18], [-30, -60], [-24, -96]]);
    paint(ctx, back.colour, -106, -14, { line: 2.4 });
    smooth(ctx, [[-20, -96], [-24, -60], [-28 + sway, -22]], false); line(ctx, shade(back.colour, -0.25), 2);
  } else if (back.type === 'scarf') {
    smooth(ctx, [[-4, -110], [-18, -104], [-38 + sway, -96], [-52 + sway * 1.4, -100], [-40 + sway, -104], [-24, -112]]);
    paint(ctx, back.colour, -112, -96, { line: 2 });
    smooth(ctx, [[-6, -106], [-22, -96], [-34 + sway, -84], [-40 + sway, -88], [-24, -102]]);
    paint(ctx, shade(back.colour, -0.1), -106, -84, { line: 2 });
  } else if (back.type === 'mantle') {
    smooth(ctx, [[-20, -108], [14, -110], [10, -92], [-6, -70], [-20 + sway, -54], [-30, -66], [-30, -92]]);
    paint(ctx, back.colour, -110, -54, { line: 2.4 });
    for (let i = 0; i < 4; i++) {
      withTransform(ctx, -26 + i * 2 + sway * 0.5, -62 + i * -10, -0.6 + i * 0.2, 1, () => {
        smooth(ctx, [[0, 0], [5, -6], [0, -13], [-5, -6]]);
        paint(ctx, shade(back.colour, 0.25), -13, 0, { line: 1.2 });
      });
    }
  } else if (back.type === 'satchel') {
    roundRectPath(ctx, -26, -76, 20, 22, 4); paint(ctx, back.colour, -76, -54, { line: 2.2 });
    poly(ctx, [[-26, -70], [-6, -70]], false); line(ctx, shade(back.colour, -0.35), 1.6);
    circlePath(ctx, -16, -66, 2); ctx.fillStyle = '#c9a227'; ctx.fill();
  }
}

function drawLeg(ctx, hip, knee, ankle, colour, boots) {
  limb(ctx, [hip, knee, ankle], 14, colour);
  const [ax, ay] = ankle;
  if (!boots) {
    smooth(ctx, [[ax - 8, ay - 4], [ax + 2, ay - 8], [ax + 14, ay - 4], [ax + 16, ay + 6], [ax - 8, ay + 6]], true, 0.3);
    paint(ctx, BOOT_DEFAULT, ay - 8, ay + 6, { line: 2.2 });
    return;
  }
  const c = boots.colour || '#3d4a3a';
  const trim = boots.trim || shade(c, -0.3);
  if (boots.glow) glow(ctx, ax + 3, ay - 10, 18, boots.glow, 0.35);
  if (boots.shape === 'wraps') {
    limb(ctx, [[knee[0] * 0.4 + ax * 0.6, knee[1] * 0.4 + ay * 0.6], [ax, ay - 2]], 15, c, { outline: 2 });
    for (let i = 0; i < 4; i++) {
      const t = 0.2 + i * 0.2;
      const px = knee[0] * (0.4 - t * 0.4) + ax * (0.6 + t * 0.4);
      const py = knee[1] * (0.4 - t * 0.4) + ay * (0.6 + t * 0.4);
      poly(ctx, [[px - 7, py - 3], [px + 7, py + 1]], false); line(ctx, trim, 1.4);
    }
    smooth(ctx, [[ax - 7, ay - 4], [ax + 2, ay - 7], [ax + 13, ay - 3], [ax + 15, ay + 6], [ax - 7, ay + 6]], true, 0.3);
    paint(ctx, shade(c, -0.25), ay - 7, ay + 6, { line: 2 });
    return;
  }
  // Tall boots: shaft up to just below the knee, then the foot.
  const top = [knee[0] * 0.75 + ax * 0.25, knee[1] * 0.75 + ay * 0.25];
  limb(ctx, [top, [ax, ay - 2]], 16.5, c);
  smooth(ctx, [[ax - 9, ay - 6], [ax + 2, ay - 10], [ax + 15, ay - 5], [ax + 17, ay + 5], [ax - 9, ay + 6]], true, 0.3);
  paint(ctx, c, ay - 10, ay + 6, { line: 2.2 });
  poly(ctx, [[ax - 9, ay + 4], [ax + 17, ay + 4]], false); line(ctx, shade(c, -0.55), 2.6);
  poly(ctx, [[top[0] - 8, top[1] + 1], [top[0] + 8, top[1] - 1]], false); line(ctx, trim, 3);
  if (boots.shape === 'striders') {
    smooth(ctx, [[top[0] + 4, top[1] + 2], [ax + 8, ay - 14], [ax + 4, ay - 8], [top[0] + 1, top[1] + 4]]);
    paint(ctx, trim, top[1], ay - 8, { line: 1.6 });
  }
}

function drawArmSleeve(ctx, shoulder, elbow, hand, colour) {
  limb(ctx, [shoulder, elbow, hand], 12, colour);
}

function drawHand(ctx, [x, y], skin, ring) {
  circlePath(ctx, x, y, 5.6);
  paint(ctx, skin, y - 6, y + 6, { line: 2 });
  if (ring) {
    poly(ctx, [[x - 1, y - 4.5], [x + 2.5, y - 4.5]], false); line(ctx, ring.colour || '#e3c25b', 2.4);
    if (ring.gem) { circlePath(ctx, x + 1, y - 5.5, 1.5); ctx.fillStyle = ring.gem; ctx.fill(); }
  }
}

function drawTorso(ctx, look, breathe) {
  const top = -106 + breathe;
  // Base garment.
  smooth(ctx, [[-19, top + 2], [-4, top - 2], [16, top], [22, top + 8], [19, -78], [17, -58], [-15, -58], [-19, -80]], true, 0.35);
  paint(ctx, look.cloth, top, -58, { line: 2.4 });
  // Collar trim.
  ctx.beginPath(); ctx.moveTo(-6, top); ctx.quadraticCurveTo(6, top + 10, 16, top + 1); line(ctx, look.trim, 2.6);
}

function drawSkirt(ctx, look, sway) {
  switch (look.skirt) {
    case 'robe':
      smooth(ctx, [[-17, -64], [17, -64], [24, -30], [28 + sway * 0.3, -6], [-24 + sway * 0.3, -6], [-21, -32]], true, 0.3);
      paint(ctx, look.cloth, -64, -6, { line: 2.4 });
      poly(ctx, [[-24 + sway * 0.3, -9], [28 + sway * 0.3, -9]], false); line(ctx, look.trim, 3);
      poly(ctx, [[4, -60], [6, -12]], false); line(ctx, look.trim, 2.2, 0.8);
      break;
    case 'tabard':
      poly(ctx, [[-6, -64], [14, -64], [16, -34], [4, -30], [-8, -34]]);
      paint(ctx, look.cloth, -64, -30, { line: 2.2 });
      poly(ctx, [[4, -60], [4, -36]], false); line(ctx, look.trim, 2.4);
      break;
    case 'coat':
      smooth(ctx, [[-18, -66], [18, -66], [20, -36], [10 + sway * 0.3, -30], [-22 + sway * 0.3, -32], [-21, -50]], true, 0.3);
      paint(ctx, look.cloth, -66, -30, { line: 2.2 });
      break;
    default:
      break;
  }
}

/** Chest armour drawn over the base garment. */
function drawChest(ctx, armour, look, breathe) {
  if (!armour) return;
  const c = armour.colour || '#8f969e';
  const trim = armour.trim || shade(c, -0.3);
  const top = -106 + breathe;
  if (armour.glow) glow(ctx, 2, -84, 34, armour.glow, 0.3);
  switch (armour.shape) {

/* localStorage wrapper. Every read is defensive: a corrupt or oversized save

  meta: 'meta',

function load(key, fallback = null) {

    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch (err) {

    return true;
  } catch (err) {
    console.warn(`[storage] could not write "${key}"`, err);
    return false;
  }

/* Minimal pub/sub so systems can talk without importing each other. */

const listeners = new Map();

function on(event, fn) {
  if (!listeners.has(event)) listeners.set(event, new Set());
  listeners.get(event).add(fn);
  return () => off(event, fn);
}

function off(event, fn) {
  listeners.get(event)?.delete(fn);

  const set = listeners.get(event);
  if (!set) return;

function addItem(run, itemId, count = 1) {
  if (!ITEMS[itemId] || count <= 0) return false;
  run.inventory[itemId] = (run.inventory[itemId] || 0) + count;
  return true;
}

function removeItem(run, itemId, count = 1) {
  const have = run.inventory[itemId] || 0;
  if (have < count) return false;
  if (have === count) delete run.inventory[itemId];
  else run.inventory[itemId] = have - count;
  return true;
}

function countItem(run, itemId) {
  return run.inventory[itemId] || 0;
}

function inventoryEntries(run, kind = null) {
  return Object.entries(run.inventory)
    .map(([id, count]) => ({ item: getItem(id), count }))
    .filter(entry => entry.item && (!kind || entry.item.kind === kind));
}

/**
 * Equip an owned item, into `slotKey` or the natural slot for it.
 * Returns { ok, reason, slot }.
 */
function equip(run, itemId, slotKey = null) {
  const item = getItem(itemId);
  const owned = countItem(run, itemId);
  if (!item || owned <= 0) return { ok: false, reason: 'You do not have that.' };
  const slot = slotKey || defaultSlot(run, item, owned);
  if (!slot) return { ok: false, reason: 'That cannot be equipped.' };
  const check = canEquip(run, item, slot, owned);
  if (!check.ok) return check;
  placeInSlot(run, item, slot);
  run.hp = Math.min(run.hp, derived(run).maxHp);
  emit('stats:changed');
  return { ok: true, slot };
}

function unequip(run, slotKey) {
  if (!run.equipped[slotKey]) return false;
  run.equipped[slotKey] = null;
  run.hp = Math.min(run.hp, derived(run).maxHp);
  emit('stats:changed');
  return true;
}

/** Drop any slot that points at more copies than the inventory holds. */
function tidyEquipment(run) {
  pruneEquipment(run, id => countItem(run, id));
}

/* ---------------------------------------------------------------
   Study statistics
   --------------------------------------------------------------- */

function recordAnswer(question, verdict) {
  const meta = game.meta;
  meta.questionsAnswered++;
  if (verdict === 'correct') meta.questionsCorrect++;
  if (verdict === 'partial') meta.questionsPartial++;

  const bump = (bucket, key) => {
    const entry = bucket[key] || { seen: 0, correct: 0, partial: 0 };
    entry.seen++;
    if (verdict === 'correct') entry.correct++;
    if (verdict === 'partial') entry.partial++;
    bucket[key] = entry;
  };

  bump(meta.bySubject, question.subjectId);
  bump(meta.byTopic, `${question.subjectId}::${question.topic}`);

  const history = meta.questionHistory[question.id] || { seen: 0, correct: 0, lastWrong: false };
  history.seen++;
  if (verdict === 'correct') history.correct++;
  history.lastWrong = verdict !== 'correct';
  meta.questionHistory[question.id] = history;
}

function accuracy(entry) {
  if (!entry || !entry.seen) return 0;
  return (entry.correct + entry.partial * 0.5) / entry.seen;
}

function weakestTopics(limit = 6, minSeen = 3) {
  return Object.entries(game.meta.byTopic || {})
    .filter(([, entry]) => entry.seen >= minSeen)
    .map(([key, entry]) => {

      return { subjectId, topic, entry, accuracy: accuracy(entry) };
    })
    .sort((a, b) => a.accuracy - b.accuracy)
    .slice(0, limit);
}

  run.log = run.log || [];

    ['Exclusive', 'Intensive', 'Selective', 'Warehousing'], 'C',
    'A limited number of chosen outlets is selective distribution. Exclusive means a single outlet; intensive means everywhere possible.'),
  mc(2017, '6', 'Finance', 2,
    'A sole trader invests $500 000 into her business. What is this an example of?',
    ['An overdraft', 'Retained profits', 'Internal debt finance', 'Internal equity finance'], 'D',
    'Money the owner puts in is owner’s equity — internal equity finance. Retained profits are also internal equity, but they come from past profits, not a fresh contribution.'),
  mc(2017, '7', 'Marketing', 2,
    'Vinh’s friends tell him that a particular brand makes poor quality jeans. He does not buy this brand due to his friends’ opinions. Which factor is influencing his choice?',
    ['Economic', 'Government', 'Sociocultural', 'Psychological'], 'C',
    'Influence from friends and reference groups is sociocultural. Psychological factors come from within — perception, motivation, attitudes.'),
  mc(2017, '8', 'Marketing', 2,
    'A customer returns a chainsaw to the place of purchase as it does not cut branches. On what basis must the business refund the cost of the chainsaw?',
    ['Implied conditions', 'Ethical considerations', 'Relationship marketing', 'Accuracy in advertising'], 'A',
    'Goods must be fit for purpose — an implied condition under consumer law. A chainsaw that cannot cut branches fails it.'),
  mc(2017, '9', 'Operations', 2,
    'Which operations process uses a Gantt chart?',
    ['Customisation', 'Input', 'Output', 'Transformation'], 'D',
    'Gantt charts schedule tasks during transformation, alongside sequencing, critical path analysis and monitoring.'),
  mc(2017, '10', 'Marketing', 3,
    'Salty Sunscreens sells the following sunscreens, both containing the same ingredients. This is an example of which of the following?',
    ['Price leading', 'Price skimming', 'Price penetration', 'Price discrimination'], 'D',
    'The same product sold at different prices to different segments is price discrimination.',
    `SALTY SUNSCREEN for TEENAGERS   200 mL   $15
SALTY SUNSCREEN for ADULTS      200 mL   $10`),
  mc(2017, '11', 'Human Resources', 2,
    'Whose interests is an organisation most likely to be representing when it meets with government to discuss business flexibility, expansion and competitiveness?',
    ['Employees', 'Employers', 'Society', 'Unions'], 'B',
    'Flexibility, expansion and competitiveness are business concerns. An employer association such as the Australian Industry Group represents employers.'),
  mc(2017, '12', 'Finance', 3,
    'The efficiency of a business can best be determined by which of the following?',
    ['Gross profit ratio', 'Value of current assets', 'Value of current liabilities', 'Accounts receivable turnover ratio'], 'D',
    'Efficiency ratios are the expense ratio and the accounts receivable turnover ratio. The gross profit ratio measures profitability.'),
  mc(2017, '13', 'Finance', 2,
    'Why would a business factor its accounts receivables?',
    ['To improve cash flow', 'To increase owner’s equity', 'To increase the value of current assets', 'To improve the value of the business'], 'A',
    'Factoring sells receivables at a discount for cash now: better cash flow, at the cost of the discount.'),
  mc(2017, '14', 'Marketing', 2,
    'In which type of market would a large scale manufacturer of pasta purchase flour for its products?',
    ['Consumer', 'Industrial', 'Mass', 'Resource'], 'B',
    'Buying flour to transform into pasta is purchasing in the industrial market.'),
  mc(2017, '15', 'Finance', 3,
    'Mick is deciding whether to purchase Business A or Business B and has received the following information. Which of the following will help Mick make the best decision?',
    ['Total sales', 'Industry averages', 'The value of assets', 'Comparative ratio analysis'], 'D',
    'Raw dollar figures cannot be compared between businesses of different sizes. Ratios put both on the same scale.',
    `                   Business A    Business B
Assets ($)         10 million     1 million
Total sales ($)     4 million     2 million`),
  mc(2017, '16', 'Operations', 2,
    'Which of the following actions is an example of corporate social responsibility?',
    ['Sponsoring a sporting event', 'Opening a manufacturing plant', 'Introducing a community health program', 'Paying compensation for a work-related injury'], 'C',
    'CSR goes beyond what the law requires, for the community’s benefit. Injury compensation is a legal obligation; sponsorship is promotion.'),
  mc(2017, '17', 'Finance', 4,
    'The expense ratio (total expenses ÷ sales) is always',
    ['the difference between the net profit ratio and the gross profit ratio.', 'the difference between sales and the gross profit ratio.', 'greater than the gross profit ratio.', 'greater than the net profit ratio.'], 'A',
    'Gross profit − expenses = net profit, so dividing everything by sales: GP ratio − expense ratio = NP ratio. The expense ratio is the gap between the two.'),
  mc(2017, '18', 'Finance', 2,
    'Which organisation ensures that Barb’s Batteries Pty Ltd operates in a financially responsible manner?',
    ['Australian Securities and Investments Commission', 'Australian Prudential Regulation Authority', 'Australian Securities Exchange', 'Reserve Bank of Australia'], 'A',
    'ASIC regulates companies (Pty Ltd included). APRA supervises banks, insurers and super funds.'),
  mc(2017, '19', 'Human Resources', 3,
    'A business implements a new policy that limits the use of work-related email accounts before 8 am and after 8 pm. Which consideration has most likely led to the development of this policy?',
    ['Economic', 'Legal', 'Social', 'Technological'], 'C',
    'Protecting work–life balance — the right to disconnect — is a social influence on HR.'),
  mc(2017, '20', 'Finance', 4,
    'The table shows information supplied by a business. Which row shows the sales and net profit for this business?',
    ['Sales $66 700 · Net profit $50 000', 'Sales $200 000 · Net profit $100 000', 'Sales $600 000 · Net profit $200 000', 'Sales $600 000 · Net profit $300 000'], 'D',
    'Sales = gross profit ÷ GP ratio = 400 000 ÷ 0.667 = $600 000. Net profit = 50% × 600 000 = $300 000.',
    `Sales                                    ?
Cost of goods sold                       ?
Gross profit                      $400 000
Expenses                                 ?
Net profit                               ?
Gross profit ratio (GP ÷ sales)      66.7%
Net profit ratio (NP ÷ sales)          50%`),

  /* ------------------------------ 2018 ------------------------------ */
  mc(2018, '1', 'Human Resources', 1,
    'Sarah works 40 hours per week. Her contract entitles her to sick leave, paid annual leave and superannuation. What type of employment is this?',
    ['Casual full-time', 'Casual part-time', 'Permanent full-time', 'Permanent part-time'], 'C',
    'Paid leave entitlements mean permanent (casuals get a loading instead); 40 hours a week is full-time.'),
  mc(2018, '2', 'Marketing', 1,
    'An entrepreneur uses social media to sell make-up to her friends and acquaintances. What marketing strategy is the entrepreneur using?',
    ['E-marketing', 'Personal selling', 'Product differentiation', 'Intensive channel choice'], 'A',
    'Selling through social media is e-marketing.'),
  mc(2018, '3', 'Operations', 2,
    'Phil goes overseas to a photographic equipment trade fair where he sees other businesses using more efficient methods of taking passport photos. What is this an example of?',
    ['Process layout', 'Economies of scale', 'Scanning and learning', 'Inventory management'], 'C',
    'Studying how others do it overseas, to adopt best practice, is scanning and learning.'),
  mc(2018, '4', 'Human Resources', 1,
    'Which of the following is an example of voluntary separation in the workplace?',
    ['Dismissal', 'Promotion', 'Reinstatement', 'Resignation'], 'D',
    'Resignation is the employee’s own choice. Dismissal is involuntary; promotion and reinstatement are not separations at all.'),
  mc(2018, '5', 'Marketing', 2,
    'A landscaping business includes an image of a large purple coloured tree on its website and its vehicles. Which of the following is the most likely reason for this?',
    ['Sales promotion', 'Niche marketing', 'Product branding', 'Competitive positioning'], 'C',
    'A consistent logo across the website and vehicles builds a recognisable brand.'),
  mc(2018, '6', 'Operations', 1,
    'A cake manufacturer buys more sugar as its production output increases. This enables it to buy the sugar at a lower price per kilogram. What is this an example of?',
    ['Logistics', 'Just-in-time', 'Global sourcing', 'Economies of scale'], 'D',
    'A lower cost per unit from buying in bulk is an economy of scale.'),
  mc(2018, '7', 'Finance', 3,
    'In which of the following are both sources of funds appropriate for a business purchasing extra stock before a busy trading period?',
    ['Debentures and factoring', 'Retained profits and unsecured notes', 'Debentures and bank overdraft', 'Retained profits and bank overdraft'], 'D',
    'Stock is a short-term need, so use short-term or internal funds: retained profits and an overdraft. Debentures and unsecured notes are long-term debt.'),
  mc(2018, '8', 'Human Resources', 3,
    'The Fair Work Commission has finalised a dispute between a large business and a union. Which strategy has been used to resolve this workplace dispute?',
    ['Mediation', 'Arbitration', 'Negotiation', 'Common law action'], 'B',
    'When the Fair Work Commission makes a binding decision to finalise a dispute, that is arbitration. A mediator only helps the parties reach their own agreement.'),
  mc(2018, '9', 'Operations', 2,
    'A soup manufacturer finds it difficult to cope with the increase in demand for soup in winter. Which performance objective could assist this business to meet the demand?',
    ['Cost', 'Customisation', 'Dependability', 'Flexibility'], 'D',
    'Flexibility is the ability to change volume (and variety) as demand changes — scaling up for winter.'),
  mc(2018, '10', 'Marketing', 2,
    'Which approach is being used when a business creates a focus group to evaluate a product?',
    ['Marketing', 'Production', 'Selling', 'Standardisation'], 'A',
    'Asking customers what they think puts customer needs first — the marketing approach.'),
  mc(2018, '11', 'Human Resources', 2,
    'An increasing number of employees are seeking a better work–life balance. As a result, many businesses are adopting job sharing. This is an example of establishing',
    ['communication systems in response to a social influence.', 'flexible working conditions in response to a social influence.', 'communication systems in response to an economic influence.', 'flexible working conditions in response to an economic influence.'], 'B',
    'Job sharing is a flexible working condition, and wanting work–life balance is a social influence.'),
  mc(2018, '12', 'Finance', 3,
    'Kevin is considering investing in a business. To help Kevin determine which business to invest in, he should consider comparative ratio analysis because',
    ['cash flow is assessed.', 'market share is determined.', 'similar businesses are evaluated.', 'business sales growth is measured.'], 'C',
    'Comparative ratio analysis compares a business against similar businesses (and industry averages), which is exactly an investor’s question.'),
  mc(2018, '13', 'Operations', 1,
    'Sani works for a large manufacturing business. She organises the transport of raw materials and finished products across Australia. Which of the following describes her area of responsibility?',
    ['Logistics', 'Service design', 'Global sourcing', 'Leading edge technology'], 'A',
    'Moving materials and products — transport, distribution, warehousing — is logistics.'),
  mc(2018, '14', 'Marketing', 2,
    'Recently a business has removed one of its products from sale because it may contain toxic ingredients that could pose a health risk. What is the most likely influence on this marketing decision?',
    ['Competitive fairness', 'Product differentiation', 'Government legislation', 'Economic considerations'], 'C',
    'Product safety is enforced by law — consumer protection legislation.'),
  mc(2018, '15', 'Operations', 3,
    'What is a benefit to an Australian clothing company of outsourcing its manufacturing overseas?',
    ['It can control the production costs.', 'It can lower human resource compliance costs.', 'It can decide which particular employees manufacture its products.', 'It can consider the foreign manufacturer’s workers as its own employees.'], 'B',
    'The overseas workers are not the company’s employees, so it avoids Australian HR compliance costs — awards, super, WHS. It loses control (options A and C) rather than gaining it.'),
  mc(2018, '16', 'Operations', 3,
    'Which of the following lists three examples of transformed resources?',
    ['Customers, information, materials', 'Facilities, information, technology', 'Customers, human resources, materials', 'Facilities, human resources, technology'], 'A',
    'Transformed resources are what gets changed: materials, information and customers. Transforming resources — facilities and human resources — do the changing.'),
  mc(2018, '17', 'Marketing', 3,
    'Staff members at VAL’s vegan restaurant wear uniforms with a large letter V on them. They are expected to greet customers with a smile and clean up any spills immediately. Which element of the marketing strategy are these requirements an example of?',
    ['Packaging', 'Positioning', 'Promotion mix', 'Physical evidence'], 'D',
    'In the services marketing mix, the tangible cues of a service — uniforms, cleanliness, staff presentation — are physical evidence.'),
  mc(2018, '18', 'Finance', 3,
    'Australian businesses export to Canada. What would happen if the value of the Australian dollar increased compared to the Canadian dollar?',
    ['There would be no effect on Canadian businesses.', 'Australian imports from Canada would become more expensive.', 'Canadian businesses would find Australian products more affordable.', 'Australian products would become more expensive for Canadian businesses.'], 'D',
    'A stronger Australian dollar takes more Canadian dollars to buy, so Australian exports cost Canadians more (and Canadian imports get cheaper for Australians).'),
  mc(2018, '19', 'Finance', 3,
    'What is the gross profit ratio for the business?',
    ['53%', '67%', '78%', '90%'], 'B',
    'Gross profit = sales − COGS = 600 000 − 200 000 = $400 000. 400 000 ÷ 600 000 = 66.7%, so 67%. (Expenses come below gross profit — they do not affect it.)',
    `Sales                 $600 000
Owner’s equity        $320 000
Accounts receivable    $41 000
Cost of goods sold    $200 000
Expenses               $60 000
Gross profit ratio = gross profit ÷ sales`),
  mc(2018, '20', 'Finance', 4,
    'What is the average number of days the business takes to collect its debts?',
    ['15 days', '25 days', '29 days', '30 days'], 'B',
    'Accounts receivable turnover = 600 000 ÷ 41 000 = 14.6 times a year. 365 ÷ 14.6 ≈ 25 days. (Option A, 15, is the turnover figure — a trap.)',
    `Sales                 $600 000
Owner’s equity        $320 000
Accounts receivable    $41 000
Cost of goods sold    $200 000
Expenses               $60 000
Accounts receivable turnover ratio = sales ÷ accounts receivable`),

  /* ------------------------------ 2019 ------------------------------ */
  mc(2019, '1', 'Marketing', 1,
    'Sam runs a business that designs and sells custom-made, high fashion clothes. In which type of market is Sam’s business operating?',
    ['Intermediate', 'Mass', 'Niche', 'Resource'], 'C',
    'Custom-made, high-fashion clothing serves a small, specific segment with distinct needs — a niche market. A mass market targets everyone with one offering; intermediate and resource markets are business-to-business.'),
  mc(2019, '2', 'Finance', 1,
    'A business is purchasing a new property. Which source of finance would be the most appropriate?',
    ['Shares', 'Mortgage', 'Debenture', 'Letter of credit'], 'B',
    'Match the term of the finance to the life of the asset: a long-term loan secured against the property itself is a mortgage. A letter of credit is a method of international payment, not a source of funds.'),
  mc(2019, '3', 'Human Resources', 2,
    'A business in crisis needs to make immediate and timely decisions in order to survive. Which leadership style does a manager of this business need to adopt?',
    ['Autocratic', 'Bureaucratic', 'Democratic', 'Laissez-faire'], 'A',
    'An autocratic manager decides alone, which is the fastest style — appropriate when speed matters more than consultation. Democratic and laissez-faire styles take time that a business in crisis does not have.'),
  mc(2019, '4', 'Finance', 2,
    'A business requires new manufacturing equipment. Which of the following would provide leasing for this equipment?',
    ['Unit trusts', 'Property trusts', 'Finance companies', 'Superannuation funds'], 'C',
    'Finance companies specialise in leasing and factoring. Unit trusts and property trusts pool investors’ money into assets; superannuation funds invest retirement savings.'),
  mc(2019, '5', 'Marketing', 3,
    'A bakery produces organic bread that is sold in health food stores. Which is the most appropriate channel choice for this product?',
    ['Exclusive', 'Extensive', 'Intensive', 'Selective'], 'D',
    'Selective distribution uses a limited number of outlets suited to the product — here, health food stores. Intensive puts the product everywhere (supermarkets, servos); exclusive restricts it to a single outlet.'),
  mc(2019, '6', 'Marketing', 2,
    'A biscuit manufacturer reduces the price of its biscuits to below cost in order to attract more customers. Which of the following identifies this approach?',
    ['Skimming', 'Loss leader', 'Price points', 'Production leader'], 'B',
    'Pricing below cost to draw customers in is a loss leader: the loss is recovered on other purchases. Skimming is a high introductory price.'),
  mc(2019, '7', 'Marketing', 1,
    'Which term refers to a sales technique disguised as market research?',
    ['Sugging', 'Telemarketing', 'Implied conditions', 'Engaging in fair competition'], 'A',
    '“Sugging” — selling under the guise of research — is an ethical issue in marketing: the customer believes they are helping a survey, then faces a sales pitch.'),
  mc(2019, '8', 'Operations', 3,
    'What effect would a global downturn in the economic outlook have on Australia’s unemployment, output and exchange rates?',
    ['Unemployment increases · output increases · exchange rate decreases',
     'Unemployment decreases · output increases · exchange rate increases',
     'Unemployment decreases · output decreases · exchange rate increases',
     'Unemployment increases · output decreases · exchange rate decreases'], 'D',
    'A global downturn cuts demand for Australian exports, so output falls and firms shed workers (unemployment rises). Lower demand for Australian goods means lower demand for the Australian dollar, so it depreciates.'),
  mc(2019, '9', 'Operations', 1,
    'A business reduces product defects by using inspections in the production process. This is an example of quality',
    ['control.', 'improvement.', 'innovation.', 'production.'], 'A',
    'Inspection that detects defects is quality control. Quality assurance builds standards into the process to prevent defects; quality improvement is ongoing (TQM).'),
  mc(2019, '10', 'Human Resources', 2,
    'What is the common sequence for resolving workplace disputes?',
    ['Mediation, negotiation, involvement of courts and tribunals',
     'Negotiation, mediation, involvement of courts and tribunals',
     'Involvement of courts and tribunals, negotiation, mediation',
     'Negotiation, involvement of courts and tribunals, mediation'], 'B',
    'Disputes escalate from the least formal to the most: the parties negotiate directly, then bring in a neutral mediator, and only then go to courts and tribunals such as the Fair Work Commission.'),
  mc(2019, '11', 'Operations', 2,
    'A sole-trader cleaning business purchases generic products to lower costs and be price competitive. This is an example of which strategy?',
    ['Cost leadership', 'Economies of scale', 'Inventory management', 'Goods and service differentiation'], 'A',
    'Cutting input costs to compete on price is cost leadership. Economies of scale come from producing at higher volume, which a sole trader buying generic products is not doing.'),
  mc(2019, '12', 'Finance', 4,
    'Which of the following allows shareholders of a public company to acquire additional shares at a discount?',
    ['New issues', 'Placements', 'Private equity', 'Unsecured notes'], 'B',
    'NESA’s key gives placements. A new issue is the first sale of shares to the public; private equity is raised outside the stock exchange; unsecured notes are debt, not shares.'),
  mc(2019, '14', 'Finance', 3,
    'Which of the following is the correct order for financial planning?',
    ['Developing budgets, determining financial needs, maintaining record systems, identifying financial risks, establishing financial controls',
     'Determining financial needs, establishing financial controls, identifying financial risks, maintaining record systems, developing budgets',
     'Determining financial needs, developing budgets, maintaining record systems, identifying financial risks, establishing financial controls',
     'Developing budgets, maintaining record systems, identifying financial risks, establishing financial controls, determining financial needs'], 'C',
    'The planning process runs: determine financial needs → develop budgets → maintain record systems → identify financial risks → establish financial controls. Needs must come first because every budget is built on them.'),
  mc(2019, '15', 'Finance', 4,
    'What is the gearing ratio (total liabilities ÷ total equity) for this business?',
    ['0.67 : 1', '0.73 : 1', '0.75 : 1', '0.81 : 1'], 'C',
    'Total liabilities = 10 000 + 5 000 + 135 000 = $150 000. Total equity = 184 000 + 16 000 = $200 000. Gearing = 150 000 ÷ 200 000 = 0.75 : 1 — below 1 : 1, so conservatively geared.',
    `Balance sheet as at 30 June 2019 ($)
Current assets                   Current liabilities
  Cash                 10 000      Accounts payable   10 000
  Accounts receivable   5 000      Overdraft           5 000
  Stock                 8 000
Non-current assets               Non-current liabilities
  Plant and equipment  35 000      Mortgage          135 000
  Land and buildings  292 000    Total equity
                                   Capital           184 000
                                   Net profit         16 000
Total                 350 000    Total               350 000`),
  mc(2019, '16', 'Finance', 2,
    'Which independent federal body ensures that businesses adhere to government regulations, maintain appropriate financial information and provide consumer protection?',
    ['Reserve Bank of Australia', 'Australian Securities Exchange', 'Australian Prudential Regulation Authority', 'Australian Securities and Investment Commission'], 'D',
    'ASIC regulates companies, financial reporting and consumer protection in financial services. APRA supervises banks, insurers and super funds; the ASX is the market operator; the RBA sets monetary policy.'),

  /* ------------------------------ 2020 ------------------------------ */
  mc(2020, '2', 'Human Resources', 2,
    'Betty believes she is eligible to ask her employer for flexible working arrangements. Which of the following is a provision of the Fair Work Act 2009 (Cth) that gives Betty the right to make this request?',
    ['A modern award', 'A common law contract', 'An enterprise agreement', 'Minimum employment standards'], 'D',
    'The right to request flexible working arrangements is one of the National Employment Standards — the minimum employment standards that apply to every employee regardless of award or agreement.'),
  mc(2020, '3', 'Human Resources', 2,
    'A firm has been hiring its own staff but due to growth no longer has time to satisfactorily manage this process. What could the firm’s human resource manager use to resolve this issue?',
    ['Acquisition', 'Outsourcing', 'Recruitment', 'Selection'], 'B',
    'Contracting the hiring process to a specialist agency is outsourcing an HR function. Acquisition, recruitment and selection are the very processes the firm no longer has time to run.'),
  mc(2020, '4', 'Marketing', 1,
    'Australian businesses are required by law to offer a refund if the product or service',
    ['does not match the description.', 'is no longer required by the customer.', 'is damaged by the customer after purchase.', 'is available at a competitor’s business for a cheaper price.'], 'A',
    'Under Australian Consumer Law, goods must match their description — an implied condition. A change of mind, customer damage or a cheaper price elsewhere create no legal right to a refund.'),
  mc(2020, '5', 'Marketing', 1,
    'A business collects its own primary data through market research prior to developing a new product. Which of the following could this business have used to provide primary data?',
    ['Customer survey', 'Published journal', 'Australian Bureau of Statistics catalogue', 'Australian Bureau of Statistics census data'], 'A',
    'Primary data is collected first-hand for the purpose at hand — a customer survey. Published journals and ABS data already exist, so they are secondary.'),
  mc(2020, '6', 'Operations', 2,
    'The main advantage of economies of scale is that a business can achieve',
    ['economic objectives.', 'industry benchmarks.', 'lower per unit input costs.', 'simplified supply chain management.'], 'C',
    'Economies of scale spread fixed costs and secure bulk discounts as output grows, lowering the cost of each unit produced.'),
  mc(2020, '7', 'Operations', 2,
    'What is the most likely reason for an Australian clothing business choosing to manufacture locally?',
    ['To achieve cost leadership', 'To maintain quality control', 'To focus on other key business functions', 'To take advantage of lower overseas wages'], 'B',
    'Local manufacturing costs more but keeps production close enough to inspect and control. Cost leadership and lower wages would point overseas.'),
  mc(2020, '9', 'Human Resources', 3,
    'At which stage of the economic cycle is it most likely for a business to begin to reduce staff working hours?',
    ['Boom', 'Downswing', 'Recession', 'Upswing'], 'B',
    'Firms begin cutting hours as demand starts to fall — the downswing. In a recession they have usually moved on to redundancies.'),
  mc(2020, '10', 'Marketing', 2,
    'A company has reduced the price of their current razor as a new model will be released soon. Which stage of the product life cycle for the current razor is indicated by this decision?',
    ['Introduction', 'Growth', 'Maturity', 'Decline'], 'D',
    'Discounting an old model ahead of its replacement is a decline-stage tactic: clear the stock before sales collapse.'),
  mc(2020, '11', 'Operations', 2,
    'A manager is concerned about ongoing theft and the cost of storing raw materials. Which inventory management strategy would best address the manager’s concerns?',
    ['Just-in-time', 'Warehousing', 'Last-in-first-out', 'First-in-first-out'], 'A',
    'Just-in-time delivers materials only as needed, so there is little stock to store or steal. LIFO and FIFO are methods of valuing stock, not reducing it.'),
  mc(2020, '12', 'Human Resources', 3,
    'A NSW employer develops a return to work plan in consultation with an insurer and an injured employee. Which legislation requires the employer to undertake this action?',
    ['Fair Work Act 2009 (Cth)', 'Workers Compensation Act 1987 (NSW)', 'Work Health and Safety Act 2011 (NSW)', 'Australian Human Rights Commission Act 1986 (Cth)'], 'B',
    'Return-to-work obligations for injured workers sit under workers compensation legislation. The WHS Act is about preventing injury in the first place.'),
  mc(2020, '13', 'Operations', 3,
    'In order to achieve best practice, a mobile phone company examines global trends in phone technology before designing and producing their phones. What operations strategy is this business using?',
    ['Standardisation', 'Global sourcing', 'Scanning and learning', 'Inventory management'], 'C',
    'Studying global practice to benchmark and adopt the best of it is the global factor called scanning and learning.'),
  mc(2020, '14', 'Finance', 4,
    'A hairdresser includes proceeds of the sale of salon equipment in the business’s income statement. Which limitation of financial reporting is evident?',
    ['Timing issues', 'Valuing assets', 'Normalised earnings', 'Capitalising expenses'], 'C',
    'A one-off asset sale inflates profit for that year. Normalised earnings is the limitation about removing — or failing to remove — such unusual items so results can be compared.'),
  mc(2020, '15', 'Operations', 3,
    'A sandwich shop bakes a variety of breads throughout the day. Customers select their choice of bread and filling(s) and sandwiches are then made to order. Which pair of performance objectives would have influenced the development of this approach?',
    ['Cost and efficiency', 'Efficiency and quality', 'Cost and customisation', 'Quality and customisation'], 'D',
    'Bread baked through the day targets quality (freshness); made-to-order sandwiches target customisation. Both raise cost rather than lower it.'),
  mc(2020, '16', 'Marketing', 4,
    'A bathroom products business cannot sustain the production of their current range. A consultant has advised the business to reduce the product range. By comparing actual and planned results, which product should be deleted?',
    ['Coconut Handwash', 'Lavender Bodywash', 'Blueberry Handcream', 'Peppermint Bath Salts'], 'B',
    'Lavender Bodywash fell short of plan in BOTH halves (8 000 vs 8 500, then 8 500 vs 9 500). Peppermint missed its second-half target but beat its first. Consistent underperformance against plan is the case for deletion.',
    `Product                Jan–Jun actual  planned   Jul–Dec actual  planned
Coconut Handwash            7 500      7 500        10 000      9 000
Lavender Bodywash           8 000      8 500         8 500      9 500
Blueberry Handcream         7 000      6 000         7 500      8 000
Peppermint Bath Salts       8 000      7 000         8 500     10 000`),

  /* ------------------------------ 2021 ------------------------------ */
  mc(2021, '1', 'Finance', 1,
    'The role of a cost centre within a business is to monitor and control',
    ['assets.', 'expenses.', 'liabilities.', 'receipts.'], 'B',
    'A cost centre is a part of the business (such as IT or administration) that incurs expenses without earning revenue directly, so it is tracked to control those expenses.'),
  mc(2021, '2', 'Human Resources', 1,
    'Which pair of business functions is conducted by human resource management?',
    ['Pricing and scheduling', 'Scheduling and induction', 'Induction and recruitment', 'Recruitment and receivables'], 'C',
    'Recruitment (acquisition) and induction (development) are HR processes. Pricing is marketing, scheduling is operations, receivables is finance.'),
  mc(2021, '3', 'Operations', 2,
    'Which row of the table shows both an advantage and a disadvantage of a business investing in leading edge technology?',
    ['Advantage: higher quality output · Disadvantage: high initial investment',
     'Advantage: proven effectiveness · Disadvantage: increased waste',
     'Advantage: widely accepted and used · Disadvantage: high initial investment',
     'Advantage: increased speed · Disadvantage: increased waste'], 'A',
    'Leading-edge technology can raise quality but costs a great deal up front. “Proven effectiveness” and “widely accepted” describe established technology, not leading edge.'),
  mc(2021, '4', 'Human Resources', 2,
    'Which statement about common law contracts is correct?',
    ['Common law contracts are determined by the Fair Work Commission.',
