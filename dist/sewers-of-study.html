    'An aid exists to meet a need, and for elderly users that means ergonomics — grip, reach, strength, vision. Durability and looks matter, but only after the need is met.'),
  mc(2019, '6', IN, 2,
    'Within the design process, social media can best be used as',
    ['a form of communication.', 'an innovative design practice.', 'a current digital design technique.', 'an acceptable industrial procedure.'], 'A',
    'Social media lets designers share ideas, reach users and gather feedback — it is a communication tool, not a design technique.'),
  mc(2019, '7', IN, 2,
    'People have moved from capturing holiday memories using a digital SLR camera, which has the single function of taking photos, to a multifunctional smartphone with a camera application. A reason for this shift to using smartphones is most likely to be the',
    ['convenience of capturing experiences.', 'obsolescence of single function cameras.', 'capability to capture higher quality images.', 'process allowing for the easy digital storage of photos.'], 'A',
    'People already carry a phone, so it is always on hand — convenience. SLRs are not obsolete and still take higher-quality images.'),
  mc(2019, '8', IN, 2,
    'Built-in obsolescence creates opportunities for ongoing profits for companies by',
    ['constantly reviewing existing product lines.', 'incorporating technologies into the latest products.', 'encouraging people to change functioning products that they own.', 'generating a need for individuals to keep updating existing products.'], 'D',
    'Built-in (planned) obsolescence designs products to wear out or date, which creates a need to replace them. Option C describes products that still work — that is perceived or style obsolescence.'),
  mc(2019, '9', DP, 2,
    'Who would be the person most likely to influence the features of a new sports watch?',
    ['A product designer', 'A running enthusiast', 'A business entrepreneur', 'A biomechanical engineer'], 'B',
    'The end user shapes the features. Designers and engineers realise those features; they do not decide what runners need.'),
  mc(2019, '10', IN, 3,
    'Why do information and communication technology (ICT) companies take risks with their products by supplying their software at discounted prices or free of charge to students?',
    ['To test the software product prior to its release to industry', 'To establish product familiarity in order to capture future market share', 'To stop illegal software piracy by students copying and sharing computer programs', 'To obtain personal data when the product is downloaded, and selling it to cover costs'], 'B',
    'Students who learn on a program carry it into their careers and workplaces — today’s discount buys tomorrow’s market share.'),

  /* ------------------------------ 2020 ------------------------------ */
  mc(2020, '1', DT, 1,
    'Which of the following best describes ergonomics?',
    ['The study of human body measurement', 'The design of products to satisfy a niche market', 'Design factors to consider in developing energy-efficient products', 'The study of how people work efficiently within their physical environment'], 'D',
    'Ergonomics is the relationship between people and their environment, for efficiency, comfort and safety. Option A — body measurement — is anthropometrics, one tool ergonomics uses.'),
  mc(2020, '2', DP, 2,
    'What are designers aiming to determine first, when they carry out research prior to designing a new product?',
    ['The level of consumer need and demand', 'Suitable pricing and marketing strategies', 'The range of existing products and pending patents', 'The level of consumer acceptance of using innovative technologies'], 'A',
    'Before anything else, is there a need and will people want it? Without demand there is no project.'),
  mc(2020, '3', DP, 2,
    'An urban planner has been commissioned to design a new housing estate. Which factors would the planner initially need to consider when establishing the design brief?',
    ['The developer’s needs and constraints', 'The required infrastructure and community facilities', 'The size of the development and possible styles of housing', 'The location of the nearest major city and access to public transport'], 'A',
    'A brief starts from the client — here the developer — and their needs and constraints (budget, time, regulations). The rest is detail that follows from it.'),
  mc(2020, '4', DT, 1,
    'Which of the following best describes the primary aim of using sustainable practices?',
    ['To reduce global warming', 'To address climate change', 'To ensure that natural resources are available in the future', 'To only use materials that are either recyclable or biodegradable'], 'C',
    'Sustainability means meeting present needs without compromising future generations — keeping resources available. Climate outcomes are benefits, not the definition. (2024 Q2 asks the same thing.)'),
  mc(2020, '5', IN, 2,
    'A designer has developed an energy-efficient battery-powered home appliance. Which of the following is most likely to contribute to the success of the appliance?',
    ['Attractive design features', 'Convenience of portable appliances', 'Growing social trend to use innovative products', 'Increased demands on time in managing household chores'], 'B',
    'Battery power means no cord — the selling point is portability and the convenience it brings.'),
  mc(2020, '6', IN, 2,
    'Which of the following has had the greatest impact on the working practices of designers?',
    ['Changes in consumer needs', 'Ease of travel and flexible working conditions', 'Access to technologies with greater capabilities', 'Cost-effective communication systems and workplace opportunities'], 'C',
    'CAD, rapid prototyping, cloud collaboration and AI have changed HOW designers work more than anything else. Consumer needs change WHAT they design.'),
  mc(2020, '7', DT, 2,
    'How could a designer best ensure minimal impact on the environment when developing a new product?',
    ['Undertake a life-cycle analysis', 'Adopt a focus on the use of green technology', 'Implement a system for recycling production waste', 'Limit the material waste during the production process'], 'A',
    'Only a life-cycle analysis covers the whole life — extraction, manufacture, use and disposal. The other options each address one stage.'),
  mc(2020, '8', IN, 3,
    'Which of the following has contributed to an increase in the use of social media for researching information?',
    ['Affordability and convenience', 'The ability to capture, store and use instant real-time data', 'A greater number of people have access to this form of technology', 'The growing ownership of mobile phones with innovative app features'], 'B',
    'Social media gives designers immediate, real-time information about trends and opinions — that is what makes it useful for research.'),
  mc(2020, '9', IN, 2,
    'Which strategy should a small company use when deciding whether to adopt a new technology?',
    ['Continue to invest in the latest technology while deciding', 'Spend more time and money on staff training and development', 'Determine the percentage return of the investment in the new technology', 'Compare the cost and efficiency of the new technology with current practices'], 'D',
    'A sound decision compares the new with the existing on both cost and efficiency. A return figure on its own says nothing about whether current practice is already better.'),
  mc(2020, '10', IN, 3,
    'Struggling businesses are often forced to diversify to remain viable. This has resulted in businesses needing to design and develop',
    ['infrastructure to improve production output.', 'systems to manage activities in order to meet consumer demands.', 'a detailed life-cycle analysis of all operations to address consumer interests.', 'innovative management practices that improve output to reduce environmental impact.'], 'B',
    'Diversifying means taking on new products or services — and that needs new systems to manage them so consumer demand is met.'),

  /* ------------------------------ 2021 ------------------------------ */
  mc(2021, '1', DT, 1,
    'A design professional reviews a product that you have created and makes the comment that ‘your product is really beautiful’. To which of the following factors of design does this comment best relate?',
    ['Aesthetics', 'Ergonomics', 'Function', 'Quality'], 'A',
    'Beauty — visual appeal — is aesthetics.'),
  mc(2021, '2', DP, 1,
    'Which of the following best describes an effective process for developing design solutions?',
    ['A method of analysing a product’s development', 'A series of steps to manage time, actions and finance', 'A method of manufacturing products, systems or environments', 'A series of steps to transform an idea into a working and viable product'], 'D',
    'The design process takes an idea all the way to a working, viable solution. Option B is project management, one part of it.'),
  mc(2021, '3', DT, 2,
    'A life cycle analysis is NOT used to evaluate a product’s',
    ['chances of success.', 'marketing strategies.', 'ability to meet a design brief.', 'potential for future innovation.'], 'B',
    'A life cycle analysis studies a product’s environmental impact from cradle to grave. Marketing strategy is outside its scope. Watch for NOT in the stem.'),
  mc(2021, '4', DT, 1,
    'What is the purpose of protecting intellectual property?',
    ['To increase profit margins for designers', 'To ensure safeguards for consumer rights', 'To help distribute consumer products more widely', 'To allow designers greater control over their ideas'], 'D',
    'Patents, design registration, copyright and trademarks give the creator legal control over how their ideas are used.'),
  mc(2021, '5', IN, 3,
    'What role does the designer have when considering the economic impact of new designs on the community?',
    ['To respond to social change and use new technologies that reduce cost', 'To use environmentally friendly materials throughout the production process', 'To consider the positive and negative issues of design decisions to increase profit margins', 'To develop new products with a limited life span in order to reduce costs of manufacturing'], 'A',
    'Economic impact on the COMMUNITY: respond to what society needs and keep costs down with new technology. Option B is environmental; C and D serve the business, not the community.'),
  mc(2021, '6', DT, 3,
    'Which of the following contributes to the development of an efficient and sustainable product?',
    ['Timing the release of a product to market', 'Ensuring that the loss of natural resources is considered', 'Producing quality products that reflect and align with society’s needs', 'Effective time management, planning and evaluation throughout product development'], 'C',
    'NESA’s key: quality products that meet society’s needs last and are used, which is both efficient and sustainable.'),
  mc(2021, '7', IN, 1,
    'There has been a growing trend towards a cashless and paperless society due to technological advances which support, for example, the use of transport cards, digital subscriptions and contactless payments. Which of the following is a direct benefit of this trend to the consumer?',
    ['Increased sales', 'Greater privacy', 'Greater convenience', 'A greener environment'], 'C',
    'Tap-and-go is quicker and easier — convenience. Increased sales benefits businesses; digital payments REDUCE privacy.'),
  mc(2021, '8', DT, 2,
    'What ethical action should be taken by designers when developing a product that uses synthetic materials rather than natural resources?',
    ['Develop a returns policy for consumers', 'Inform consumers of the materials used', 'Promote the lack of environmental damage that has occurred from using synthetic materials', 'Assure consumers that the chemical composition and appearance of natural and synthetic materials are the same'], 'B',
    'Ethics here is honesty: tell consumers what the product is made of so they can choose. Options C and D make claims that may not be true.'),
  mc(2021, '10', IN, 3,
    'What is most likely to occur if emerging technologies and sustainable practices fail to align?',
    ['Growth in environmental concern will be limited.', 'Global economies will stagnate as innovation ceases to occur.', 'Political intervention will limit the research and development of design ideas.', 'An imbalance between innovative human endeavours and maintaining the natural environment will result.'], 'D',
    'If innovation ignores sustainability, progress comes at the environment’s expense — an imbalance. The other options are exaggerated claims.'),

  /* ------------------------------ 2022 ------------------------------ */
  mc(2022, '1', DT, 1,
    'A swimwear designer has been approached to develop the Australian swimsuit for the Paris Olympic Games in 2024. What factor should be considered first?',
    ['Aesthetics', 'Durability', 'Function', 'Quality'], 'C',
    'An Olympic swimsuit exists to make the athlete faster — function first. Compare 2025 Q1, where a wedding arrangement puts aesthetics first: the user and context decide.'),
  mc(2022, '2', DT, 1,
    'What is the most appropriate way a designer could protect the intellectual property of a product such as a smart phone?',
    ['Copyright', 'License', 'Patent', 'Trademark'], 'C',
    'A patent protects how an invention works — the right tool for a technological product. Copyright protects creative works; a trademark protects a brand.'),
  mc(2022, '3', IN, 2,
    'Four products are categorised according to market demand and manufacturing costs in the table. Which product should generate the most income through sales?',
    ['W', 'X', 'Y', 'Z'], 'A',
    'Most income comes from high demand and low cost: product W.',
    `                     Manufacturing costs
                     Low        High
High market demand    W          X
Low market demand     Y          Z`),
  mc(2022, '4', DP, 1,
    'Why do designers conduct market research prior to designing a new product?',
    ['To develop a possible marketing campaign', 'To determine the level of consumer demand', 'To access alternative manufacturing techniques', 'To understand the impact of a life cycle analysis'], 'B',
    'Research before designing establishes whether people want the product — consumer demand. (2020 Q2 asks the same thing.)'),
  mc(2022, '5', IN, 1,
    'Many Australian homes are currently being designed to bring the indoors to the outdoors. Which of the following has influenced this practice?',
    ['Cultural diversity', 'Changing social trends', 'Technological changes', 'Changing nature of work'], 'B',
    'Indoor–outdoor living is a lifestyle preference — a social trend.'),
  mc(2022, '6', DP, 2,
    'Which of the following should a designer first consider when conducting an analysis of a targeted audience?',
    ['Market trends', 'Brand awareness', 'Purchasing power', 'Cost-to-value ratio'], 'A',
    'Start with what the audience is currently doing and wanting — market trends — before narrowing to spending power or value.'),
  mc(2022, '7', DP, 2,
    'Why would a designer make prototypes after creating CAD models for a client?',
    ['To save time and staff costs', 'To ensure funding by investors is secured', 'To demonstrate the final design to the client', 'To simulate possible issues that may arise in production'], 'D',
    'A physical prototype reveals problems a screen cannot — fit, tolerances, assembly — before production commits money.'),
  mc(2022, '8', DT, 2,
    'What is the purpose of a designer undertaking a ‘cradle to grave’ analysis of a pending innovation?',
    ['To determine the likelihood of financial success', 'To indicate the possibility of future growth in market share', 'To determine the level of consumer demand for a new product', 'To understand the impact of the design on society and the environment'], 'D',
    '“Cradle to grave” is life cycle analysis: the impact on society and the environment across the product’s whole life.'),
  mc(2022, '9', DP, 3,
    'A designer is planning to release a line of ergonomic wheelchairs for children. What is the best way to evaluate the useability of this wheelchair?',
    ['Invest in innovative material development', 'Test the product in a range of environments', 'Consider surveys from the specific target market', 'Compare the design with competitive manufacturers'], 'B',
    'Usability is proven by use: testing in the real range of places the chair will go. Surveys capture opinions, not performance.'),
  mc(2022, '10', IN, 2,
    'The steady increase in the development of innovative and functional consumer goods that quickly become obsolete is mostly the result of',
    ['demand for newer products with better capabilities.', 'expansion of online marketing capabilities to increase sales.', 'use of rapid prototyping methods that produce more products.', 'advancements in manufacturing methods and the ease of mass production.'], 'A',
    'Consumers want the newest and most capable, so products date quickly — demand drives the cycle.'),

  /* ------------------------------ 2023 ------------------------------ */
  mc(2023, '1', DP, 1,
    'What is the primary purpose of ongoing evaluation?',
    ['To set goals', 'To explore ideas', 'To establish consumer needs', 'To solve design issues as they arise'], 'D',
    'Ongoing evaluation happens all through the project, so problems are caught and fixed as they appear, not at the end.'),
  mc(2023, '2', DT, 1,
    'A manufacturer chooses to produce cutting boards made from bamboo because it can be regrown and is inexpensive. Which of the following would be the manufacturer’s determining factor when selecting this material?',
    ['Aesthetics', 'Availability', 'Sustainability', 'Life cycle analysis'], 'C',
    '“Can be regrown” signals sustainability — a renewable resource. A life cycle analysis is a method, not a factor.'),
  mc(2023, '3', DT, 1,
    'What is the most important factor for a designer to consider when developing an innovation with ergonomic features?',
    ['Ensuring the product is user friendly', 'Integrating the latest emerging technology', 'Finding a reliable manufacturer to efficiently develop the product', 'Providing end users with resources to develop an understanding of the technology'], 'A',
    'Ergonomics is about the user, so a product with ergonomic features must be easy and comfortable to use.'),
  mc(2023, '4', DP, 1,
    'What are designers responding to when they develop products to assist people in society?',
    ['Emerging trends', 'Identified needs', 'Innovative processes', 'The natural resources available'], 'B',
    'Design starts from a need. Products that assist people respond to needs that have been identified.'),
  mc(2023, '5', DP, 1,
    'What is the primary purpose of a work health and safety (WHS) risk assessment?',
    ['To identify dangerous equipment', 'To evaluate workshop organisation and practices', 'To access the impact of materials on the environment', 'To identify and assess potential injury or illness in the workplace'], 'D',
    'A risk assessment identifies hazards and judges the likelihood and severity of harm — injury or illness — so controls can be put in place.'),
  mc(2023, '6', IN, 1,
    'A product is obsolescent when',
    ['it is ageing.', 'it is classified as an antique.', 'it cannot be repaired because parts are not available.', 'a variety of materials is considered during design and development.'], 'C',
    'Obsolescence means a product can no longer be used or kept going — for example, when spare parts stop being made. Age alone does not make something obsolete.'),
  mc(2023, '7', IN, 2,
    'Which of the following is most important for an innovative idea to be successful?',
    ['A comprehensive marketing plan', 'Workload management and state of the art equipment', 'Thorough planning, research, timing and consumer demand', 'Using local and current technologies for immediate release in the marketplace'], 'C',
    'Innovations succeed when they are well researched, well timed and meet real demand. Marketing alone cannot save a product nobody needs.'),
  mc(2023, '8', DT, 2,
    'What is the purpose of securing protection of intellectual property?',
    ['To guarantee ownership of the domain name', 'To prevent others from creating a similar product', 'To prevent breach or violation of trademarks, patents and copyright', 'To provide a legal framework to protect a designer’s creative ideas and designs'], 'D',
    'IP law gives a legal framework that protects creators’ ideas. It cannot stop all similar products, and option C is circular — it protects IP by protecting IP.'),
  mc(2023, '9', DT, 1,
    'Which of the following describes a product life cycle analysis?',
    ['An overview of the environmental impact at the development phase', 'An assessment of the manufacturer’s costs to transport and distribute the product', 'The examination of the extraction, manufacturing and final disposal of the product', 'The determination of how materials for the product will be extracted and processed'], 'C',
    'Life cycle analysis covers every stage — extraction, manufacture, use and disposal. The other options cover only one stage.'),
  mc(2023, '10', DT, 2,
    'Which of the following best demonstrates a designer taking an ethical approach when creating a new product?',
    ['Developing a product that avoids excessive use of resources', 'Using innovative technologies to ensure greater uptake in the marketplace', 'Targeting the aspirations of clients to develop a product that is easier to use', 'Adapting procedures to protect the rights and responsibilities of the designer'], 'A',
    'Ethical design considers its effect on others and the environment. Avoiding waste of resources does; the other options serve the market or the designer.'),

  /* ------------------------------ 2024 ------------------------------ */
  mc(2024, '1', DP, 1,
    'What is the primary reason a designer might run out of time to complete a project?',
    ['Poor planning', 'Meeting warranty claims', 'Inappropriate target market', 'Late final payment from client'], 'A',
    'Time management is planning — a realistic Gantt chart with contingency. The usual cause of missed deadlines is a poor plan.'),
  mc(2024, '2', DT, 1,
    'What is the main goal of sustainable design?',
    ['To preserve the ozone layer', 'To reduce pollution and waste', 'To ensure the long-term availability of natural resources', 'To promote the responsible use of affordable materials by manufacturers'], 'C',
    'Sustainable design keeps resources available for future generations. Less pollution and waste is how it gets there, not the goal.'),
  mc(2024, '3', DP, 2,
    'A designer has been asked to present a range of ideas for new greeting cards. What should the designer initially research in response to the brief?',
    ['Existing images and symbols', 'Strategies for product supply and distribution', 'Timelines and actions for product development', 'The value of instore gift cards to redeem for products'], 'A',
    'For a visual product, initial research looks at existing designs, images and symbols for inspiration and to know the market. Distribution and timelines come later.'),
  mc(2024, '4', DT, 2,
    'What are the prime considerations for designers when producing safe and ethical products for consumers?',
    ['Social trends and convenience', 'Financial market share and existing products', 'Patent protection and niche market compatibility', 'End user wellbeing and environmental friendliness'], 'D',
    'Safe means the user’s wellbeing; ethical includes the environment. Match each word in the stem to an idea in the option.'),
  mc(2024, '5', DP, 2,
    'Which of the following options best describes the features of a collaborative design team?',
    ['Leader directed, common skills among the group, responsive to feedback', 'Leader directed, various fields of professional expertise, responsive to feedback', 'Shared understanding of the project, common skills among the team, cooperative decision-making process', 'Shared understanding of the project, various fields of professional expertise, cooperative decision-making process'], 'D',
    'Collaboration means a shared goal, a mix of expertise and decisions made together — not one leader directing people with the same skills.'),
  mc(2024, '6', IN, 3,
    'Which of the following is the most effective method to improve the design of new housing estates?',
    ['Limit the designers’ creative freedom', 'Influence building regulations and land use policies', 'Mandate the use of specific brands of construction material', 'Require designers to prioritise ornate and decorative interior styles'], 'B',
    'Regulations and land use policy set the rules every estate is built under, so changing them improves all new estates at once.'),
  mc(2024, '7', DT, 3,
    'A corporation has commissioned a designer to develop a new solar-powered, mobile interactive game. What is an ethical way to protect the intellectual property of the new design?',
    ['The designer applies for a patent.', 'The corporation applies for a patent.', 'The designer applies for copyright protection.', 'The corporation applies for copyright protection.'], 'B',
    'Commissioned work belongs to the client that paid for it, so the corporation applies. A new device needs a patent.'),
  mc(2024, '8', DT, 2,
    'What is the most important reason for undertaking a life cycle analysis of an innovative design?',
    ['To establish the rights of the designer', 'To research the possibility of future growth in market share', 'To understand the impact of the project on society and the environment', 'To determine the level of consumer demand for the newly developed product'], 'C',
    'Life cycle analysis is about impact on society and the environment from cradle to grave. (2022 Q8 asks the same thing.)'),
  mc(2024, '9', DP, 1,
    'When communicating to an audience, what is the best method of effectively transferring information?',
    ['Using language and technical jargon to impress the audience', 'Keeping the message simple to appeal to a broad range of people', 'Providing as much data as possible to cover all potential interests', 'Tailoring the message to address the needs and preferences of the audience'], 'D',
    'Effective communication fits the audience. A client, a manufacturer and an investor need different messages.'),
  mc(2024, '10', DT, 2,
    'A designer has been asked to analyse the ergonomic implications of a given task. What knowledge would the designer need to have to complete the analysis?',
    ['The cost-effectiveness of innovating work practices', 'The most common workplace injuries and their causes', 'The physical demands and human requirements for the job', 'The psychological wellbeing of employees in the workplace'], 'C',
    'Ergonomics matches the task to the person: what the job demands physically and what the human body requires.'),

  /* ------------------------------ 2025 ------------------------------ */
  mc(2025, '1', DT, 1,
    'What is the most important design factor to consider when designing a flower arrangement for a wedding?',
    ['Aesthetics', 'Durability', 'Ergonomics', 'Obsolescence'], 'A',
    'A short-lived decorative product for a single event is all about visual appeal. Match the factor to the user and context: a children’s product prioritises safety (2025 Q2); an Olympic swimsuit, function (2022 Q1).'),
  mc(2025, '2', DT, 1,
    'Which of the following should a designer prioritise when designing a product for children?',
    ['Using the most affordable materials available', 'Selecting materials with high aesthetic appeal', 'Ensuring that materials are safe, durable and non-toxic', 'Creating a complex user interface for extended engagement and durability'], 'C',
    'Children chew, drop and break things — safety and durability come before cost or looks.'),
  mc(2025, '3', DP, 1,
    'Which of the following could a designer use to track the progress of a project over time?',
    ['Gantt chart', 'Venn diagram', 'SWOT analysis', 'Life cycle analysis'], 'A',
    'A Gantt chart plots tasks against time, so it is the tool for tracking progress. SWOT is situational analysis, life cycle analysis is environmental, and a Venn diagram compares.'),
  mc(2025, '4', DP, 2,
    'Why is it necessary to experiment and test for durability?',
    ['To check the market demand for the product', 'To reduce the environmental impact of the product', 'To determine if the product can be sold at a lower price', 'To understand how the product functions under different conditions'], 'D',
    'Durability testing puts the product through wear, load, weather and drops to see how it holds up in different conditions.'),
  mc(2025, '5', DP, 1,
    'Which of the following is the main purpose of analysing data collected when designing a project?',
    ['To organise information into tables and charts', 'To ensure the data looks visually appealing to investors', 'To draw meaningful conclusions that guide decision-making', 'To collect as much data as possible about manufacturing trends'], 'C',
    'Analysis turns data into conclusions that drive decisions. Tables and charts only present it.'),
  mc(2025, '6', DP, 1,
    'Collaboration with other designers can improve the outcomes of a design project by',
    ['reducing the need for communication and feedback.', 'ensuring the design project is managed by an expert.', 'increasing the manufacturing cost of the design project.', 'utilising design experience for different aspects of the project.'], 'D',
    'Collaboration brings in different expertise for different parts of the project (compare 2024 Q5).'),
  mc(2025, '7', IN, 1,
    'How has packaging design changed as a result of consumer awareness of sustainability?',
    ['Increased use of materials that break down over time', 'Increased focus on visual appeal through the use of multilayered packaging', 'Increased use of non-renewable materials to meet the need of mass production', 'Increased use of plastic packaging due to the demand for cheaper options sourced globally'], 'A',
    'Sustainability-aware consumers push packaging toward biodegradable and compostable materials. The other three move in the wrong direction.'),
  mc(2025, '8', IN, 2,
    'Which of the following social trends has had the largest impact on the production of new fitness monitoring devices?',
    ['Increase in cultural diversity', 'Growing importance of preventive healthcare', 'Increase in mobile app development standards', 'Growing concerns for data privacy and data security'], 'B',
    'People monitor their fitness to stay healthy and prevent illness — the preventive health trend drives demand for wearables.'),
  mc(2025, '10', IN, 1,
    'How has the demand for renewable energy created by emerging technologies had a positive impact on the environment?',
    ['By increasing reliance on fossil fuels', 'By decreasing greenhouse gas emissions', 'By increasing demand for finite resources', 'By decreasing demand for renewable resources'], 'B',
    'Renewables replace fossil-fuel generation, cutting greenhouse gas emissions.'),

  /* ------------------------- Section II short answers ------------------------- */
  short(2019, '11(a)', DP, 2, 'Identify TWO different methods of evaluation.',
    ['making a model and surveying a niche market'],
    [['model', 'prototyp', 'survey', 'questionnaire', 'interview', 'focus group', 'test', 'trial', 'criteria', 'pmi', 'swot', 'checklist', 'peer review', 'feedback', 'expert'],
     ['model', 'prototyp', 'survey', 'questionnaire', 'interview', 'focus group', 'test', 'trial', 'criteria', 'pmi', 'swot', 'checklist', 'peer review', 'feedback', 'expert']], 2,
    'Making a model. Surveying a niche market. (Any two distinct methods — testing a prototype, user trials, a questionnaire, a PMI chart, checking against criteria to evaluate success.)'),
  short(2019, '11(b)', DP, 3, 'Describe how evaluation can aid the design of a product.',
    ['evaluation tests ideas before full production by developing a prototype to see if the design works which gives the opportunity for further modifications'],
    [['test', 'trial', 'check', 'assess', 'judge', 'measure', 'criteria', 'prototyp'],
     ['before', 'prior', 'early', 'production', 'manufactur'],
     ['modif', 'refine', 'change', 'fix', 'problem', 'fault', 'iterat', 'works', 'better']], 2,
    'Evaluation allows designers to test ideas prior to being put into full production. This can be achieved by the designers developing a prototype to see if the design works. This will then provide the opportunity for further modifications.'),
  short(2019, '12', IN, 4, 'Discuss the influence that technology can have on the design process.',
    ['technology like cad and 3d printing lets designers make models faster and more accurately so clients see the depth of detail but it involves extra costs and staff training'],
    [['cad', 'cam', '3d', 'print', 'software', 'digital', 'computer', 'simulat', 'render', 'online', 'cloud', 'artificial intelligence'],
     ['faster', 'speed', 'quick', 'efficien', 'accura', 'detail', 'visualis', 'communicat', 'precis', 'save time', 'saves time'],
     ['cost', 'expens', 'training', 'skill', 'job', 'unemploy', 'reliance', 'rely', 'depend', 'glitch', 'learn']], 3,
    'Technology, like CAD/CAM, can improve the process used by designers. For example, whereas designers used to rely on paper based drawings, they can now use CAD/CAM technologies to 3D print a model of the object to be made. Moving from 2D to 3D helps demonstrate the depth of detail that will allow the consumer to make educated decisions about the final design. However, the use of this technology may involve additional costs in resources and/or staff training. (Discuss: give the benefit AND the drawback.)'),
  short(2019, '13', IN, 4, 'Explain how changing social trends influence design practices.',

    [['jashemski', 'fiorelli', 'maiuri', 'bisel', 'lazer', 'wallace-hadrill', 'wallace hadrill', 'osanna', 'zuchtriegel', 'weber', 'alcubierre', 'mau'],
     ['gardens', 'plants', 'casts', 'skeleton', 'regions', 'insulae', 'numbering', 'conservation', 'stratigraph', 'excavat', 'styles', 'boatshed', 'reconstruct']], 2,
    'Wilhelmina Jashemski, an American archaeologist, specialised in excavating plants at Pompeii. She identified vines, fruit trees, herbs and flowers, and showed the importance of gardens in the daily life and economy of Pompeii. (Others: Fiorelli’s casts and regions/insulae system; Maiuri at Herculaneum; Bisel and the boatshed skeletons; Wallace-Hadrill’s Herculaneum Conservation Project.)'),
  short(2024, '2', VES, 3, 'Explain what archaeological evidence reveals about food and dining in Pompeii and Herculaneum. Support your response using Source A and your own knowledge.',
    ['taverns with dolia in counters show people ate out frescoes and carbonised bread seeds and nuts show what they ate and decorated triclinia show the wealthy held dinner parties'],
    [['tavern', 'thermopoli', 'dolia', 'counter', 'popina', 'bar'],
     ['carbonised', 'carbonized', 'bread', 'seeds', 'nuts', 'fresco', 'mosaic', 'bones', 'garum', 'amphora', 'sewer'],
     ['triclinium', 'triclinia', 'dinner part', 'wealthy', 'rich', 'status', 'seafood']], 2,
    'Common people dined in taverns, selecting food from dolia set into benches; Source A is a food-stall price list (pork, bread, oil, cheese), so eating out was affordable. Frescoes and mosaics depict food; carbonised seeds, bread and nuts from Herculaneum show what people ate. Decorated triclinia show dinner parties were entertainment for the wealthy, and bones show men at Herculaneum ate more seafood than women.',
    NOT_SHOWN('Source A (a price list)')),
  short(2025, '1', VES, 2, 'Outline the main features of the eruption of Mount Vesuvius in AD 79.',
    ['earth tremors came before a violent explosion sent a column of ash and pumice 33 kilometres high herculaneum was killed by the first pyroclastic surges while pompeii endured hours of lapilli then pyroclastic flows'],
    [['tremor', 'earthquake', 'explosion', 'column', 'plinian', 'ash', 'pumice', 'lapilli', '33'],
     ['pyroclastic', 'surge', 'flow', 'toxic', 'gas'],
     ['herculaneum', 'hours', 'first', 'next day', 'second day', 'buried']], 2,
    'Earth tremors came in the weeks and months before. The eruption began with a violent explosion, sending a column of ash and pumice — and toxic gases — up to 33 km high. Herculaneum’s people were killed in the first pyroclastic surges; Pompeii endured hours of falling lapilli, then a series of pyroclastic flows.'),
  short(2025, '4', VES, 4, 'How have new technologies contributed to an understanding of Pompeii and Herculaneum?',
    ['dna from skeletons reveals origins health and diet ai has virtually unrolled the herculaneum scrolls ground penetrating radar maps buried buildings and ct scans of plaster casts reveal identities'],
    [['dna', 'ct scan', 'x ray', 'xrf', 'ground penetrating', 'radar', 'gpr', 'ai', 'artificial intelligence', '3d', 'laser', 'drone', 'digital', 'isotope'],
     ['scroll', 'papyr', 'casts', 'skeleton', 'frescoes', 'buildings', 'buried', 'unexcavated'],
     ['identit', 'origin', 'diet', 'health', 'unroll', 'read', 'reveal', 'non invasive', 'without excavat', 'reconstruct']], 3,
    'DNA from skeletons reveals genetic origins, health and diet, and links to other Mediterranean populations. AI has virtually “unrolled” the charred Herculaneum scrolls, revealing texts. Ground-penetrating radar maps buried structures without invasive digging. 3D reconstruction recreates homes, temples and shops. Portable XRF analyses frescoes, pottery and residues. CT scans of plaster casts reveal who the victims were.',
    NOT_SHOWN('Sources C and D')),

  /* --------------------------------- Sparta --------------------------------- */
  short(2019, '10(a)', SPA, 2, 'Outline the roles of the helots in this period.',
    ['helots were farm labourers on the kleroi or attendants to the king and in war they fought as light armed skirmishers or hoplites while controlled by the krypteia'],
    [['farm', 'agricultur', 'labour', 'kleros', 'kleroi', 'land', 'crops', 'produce', 'food'],
     ['war', 'army', 'battle', 'skirmish', 'light armed', 'hoplite', 'attendant', 'servant'],
     ['krypteia', 'controlled', 'fear', 'slave', 'serf', 'state owned', 'revolt', 'messenia']], 2,
    'The helots are identified in sources as farm labourers or attendants to the king. Sources also state that helots were controlled by the krypteia, and in warfare they were used for light-armed skirmishes or as hoplites.'),
  short(2019, '10(b)', SPA, 4, 'What does the ephorate reveal about Spartan political organisation in this period?',
    ['the five ephors were elected annually and monitored the kings and could put them on trial showing a balance of monarchy oligarchy and democracy and they declared war on the helots each year'],
    [['five', 'annual', 'elected', 'yearly', 'each year', 'one year', 'oath'],
     ['king', 'kings', 'trial', 'monitor', 'check', 'oversee', 'supervis', 'accompan'],
     ['mixed', 'balance', 'democra', 'oligarch', 'monarch', 'constitution', 'powerful'],
     ['helot', 'declared war', 'gerousia', 'ekklesia', 'assembly']], 3,
    'Spartan political organisation balanced monarchy, oligarchy and democracy. The ephors were the most powerful individuals in Sparta: magistrates elected annually by the people (they could not be re-elected) who swore an oath to protect the constitution. They monitored the kings, could put a king on trial and accompanied kings on campaign. They declared war on the helots every year.'),
  own(2020, '11(a)', SPA, 3, 'Describe the role of women in this period.',
    ['spartan women were trained in athletics to bear strong sons managed the household and estates and could own land so they had more freedom than other greek women'],
    [['mother', 'childbirth', 'children', 'bear', 'sons', 'reproduc', 'strong hoplites'],
     ['athlet', 'exercise', 'training', 'running', 'wrestling', 'javelin', 'physical', 'fit'],
     ['land', 'property', 'estate', 'household', 'inherit', 'kleros', 'manage', 'two fifths'],
     ['freedom', 'free', 'independen', 'outspoken', 'athen', 'other greek', 'religio', 'festival', 'artemis', 'helen']], 3,
    'A Spartan woman’s central role was to bear strong sons for the state, so girls trained in running, wrestling and javelin (Xenophon, Plutarch). With men in the barracks and on campaign, women managed households and estates; Aristotle says they owned about two-fifths of the land. They took part in religious festivals and cults (Artemis Orthia, Helen) and were famously outspoken — “come back with your shield or on it” (Plutarch, Sayings of Spartan Women) — with far more freedom than Athenian women.'),
  short(2021, '11(a)', SPA, 2, 'Outline the key features of the site of Sparta.',
    ['sparta was five unwalled villages around an acropolis and agora with the temple of athena chalkioikos the sanctuary of artemis orthia and the menelaion'],
    [['villages', 'five', 'unwalled', 'no walls', 'obai', 'amyklai', 'pitana', 'limnai'],
     ['acropolis', 'agora', 'athena', 'chalkioikos', 'artemis', 'orthia', 'menelaion', 'sanctuar', 'temple', 'amyklaion']], 2,
    'Sparta was originally five villages surrounding a public space with an acropolis and agora. Its religious buildings included the Temple of Athena Chalkioikos, the Sanctuary of Artemis Orthia and the Menelaion.'),
  short(2021, '11(b)', SPA, 3, 'What is known about Spartan technology in this period?',
    ['perioikoi workshops used moulds to cast bronze and lead figurines found at artemis orthia and made weapons and armour while the vix krater shows spartan bronze was exported'],
    [['bronze', 'lead', 'ivory', 'iron', 'pottery', 'figurine', 'krater', 'mould', 'cast', 'metal'],
     ['perioikoi', 'foreign', 'syria', 'trade', 'workshop', 'craftsm', 'mass produc'],
     ['weapon', 'armour', 'shield', 'hoplite', 'vix', 'orthia', 'export', 'abroad', 'comb']], 3,
    'Technologies were developed by Spartans, perioikoi and foreigners. Moulds cast bronze and lead items — the many lead figurines from the Sanctuary of Artemis Orthia suggest mass production in workshops. Weapons and armour were made for the military state. Spartan products were popular abroad (the Vix Krater in Burgundy). Skilled foreign workers or trade with Syria may explain ivory carving, such as combs.'),
  short(2021, '11(c)', SPA, 4, 'Explain the importance of Lycurgus and the Great Rhetra in this period.',
    ['lycurgus is the founding hero credited by plutarch with the rhetra which set up the mixed constitution of kings gerousia and ekklesia and the agoge and syssitia that made sparta a militaristic and orderly society'],
    [['agoge', 'education', 'syssitia', 'mess', 'militar'],
     ['constitution', 'gerousia', 'ekklesia', 'assembly', 'ephor', 'kings', 'mixed', 'political'],
     ['plutarch', 'herodotus', 'xenophon', 'aristotle', 'delphi', 'oracle', 'tyrtaeus'],
     ['founding', 'founder', 'hero', 'legend', 'myth', 'eunomia', 'order', 'stabil', 'worst governed', 'defined', 'identity']], 3,
    'Lycurgus was seen as the national hero and founder of Spartan society, credited (Plutarch) with the constitution, social structure, education and military structures. The Rhetra defined what it was to be Spartan — social structure, syssitia and agoge separating Spartiate from non-Spartiate. Aristotle saw a “mixed constitution” of monarchy, oligarchy and democracy; Xenophon credits Lycurgus with the syssitia. Herodotus says Sparta was the worst-governed city before the Rhetra.'),
  short(2022, '11(a)', SPA, 1, 'Outline the role of ONE god or goddess worshipped by the Spartans in this period.',
    ['apollo was worshipped for his military prowess and was associated with the sun and as a preserver of life'],
    [['apollo', 'artemis', 'athena', 'poseidon', 'ares', 'zeus', 'helen', 'dioscuri', 'castor', 'hyacinth'],
     ['military', 'war', 'sun', 'life', 'fertility', 'childbirth', 'coming of age', 'agoge', 'protect', 'earthquake', 'festival', 'karneia', 'hyakinthia', 'gymnopaedia', 'orthia', 'chalkioikos']], 2,
    'Apollo was worshipped due to his military prowess. He was also associated with the sun and as a preserver of life. (Also: Artemis Orthia — fertility and the coming of age of boys in the agoge; Athena Chalkioikos — protector of the city; Poseidon — earthquakes.)'),
  short(2022, '11(b)', SPA, 2, 'What was the significance of festivals for Spartan society?',
    ['festivals honoured the gods and brought the community together for example the karneia celebrated apollo each year and military operations were suspended'],
    [['karneia', 'carneia', 'hyakinthia', 'hyacinthia', 'gymnopaedia', 'gymnopaidia', 'orthia'],
     ['apollo', 'honour', 'gods', 'religio', 'worship', 'sacrifice'],
     ['community', 'together', 'unity', 'identity', 'cohesion', 'suspended', 'marathon', 'thermopylae', 'delayed', 'youth', 'display']], 2,
    'Festivals honoured the gods and brought the community together. The Karneia celebrated Apollo every year, and military operations were suspended during it (it delayed the Spartans before Marathon and kept most of the army home at Thermopylae). The Hyakinthia and the Gymnopaedia were also important.'),
  short(2022, '11(c)', SPA, 4, 'What do art and architecture reveal about cultural and everyday life in Sparta in this period?',
    ['a bronze statuette of a girl exercising shows sparta valued fit women austere buildings contrast with the amyklaion and lakonian vases show hunting warfare and drinking parties'],
    [['statuette', 'figurine', 'bronze', 'vase', 'pottery', 'lakonian', 'laconian', 'mask', 'ivory', 'lead'],
     ['austere', 'simple', 'plain', 'amyklaion', 'amyclae', 'menelaion', 'orthia', 'temple', 'sanctuar'],
     ['women', 'girl', 'athlet', 'exercise', 'hunting', 'warfare', 'drinking', 'symposi', 'religio', 'myth', 'hoplite']], 3,
    'A statuette of a girl exercising reveals the Spartan desire for fit, healthy women. Spartan architecture was austere, though some sanctuaries such as the Amyklaion were more exuberant. Lakonian painted vases show hunting, warfare and drinking parties, as well as mythological beings.'),
  short(2023, '11(a)', SPA, 3, 'Outline the key features of Spartan land ownership in this period.',
    ['each spartiate received an equal kleros worked by helots that passed to the eldest son or back to the state though earlier sources show inequality since chariot racing and larger syssitia contributions needed bigger estates'],
    [['kleros', 'kleroi', 'allot', 'lot', 'plot'],
     ['helot'],
     ['inherit', 'son', 'eldest', 'first born', 'returned', 'redistribut', 'women', 'daughter', 'heiress'],
     ['equal', 'unequal', 'inequal', 'wealth', 'rich', 'private', 'chariot', 'horse', 'syssitia', 'mess']], 3,
    'Land ownership was an equal, one-time distribution of kleroi to the homoioi, worked by the helots and passed to first-born sons or returned to the state for redistribution. Earlier sources show a more complicated, unequal system: some gave larger portions to the syssitia, and cavalry and chariot racing needed larger estates. Ownership was more private in character, and women had some property rights.'),
  short(2023, '11(b)', SPA, 4, 'Explain the role of Spartan kings in this period.',
    ['sparta had two kings whose roles were military religious political and judicial they led the army were chief priests sat on the gerousia but were checked by the ephors'],
    [['two', 'dual', 'diarchy', 'agiad', 'eurypontid'],
     ['army', 'command', 'general', 'campaign', 'military'],
     ['priest', 'religio', 'sacrific', 'delphi', 'oracle', 'pythia', 'pythioi'],
     ['gerousia', 'ephor', 'limited', 'judicial', 'heiress', 'adoption', 'roads', 'oath']], 3,
    'Sparta had a dual kingship whose roles were political, religious, judicial and military. Politically they were limited: members of the gerousia and subject to the ephors. They were chief priests, performing sacrifices and consulting the Pythia at Delphi. Judicially they oversaw public roads, the marriages of orphaned heiresses and adoptions. They commanded the army but later lost the right to declare war; from the late 6th century one king stayed in Sparta while the other campaigned.'),
  short(2024, '11(a)', SPA, 2, 'Outline the natural features of Sparta during this period.',
    ['sparta lay in lakonia in the peloponnese between the taygetus and parnon mountains which were defensive and the eurotas river gave fertile soil and linked to the port of gytheion'],
    [['taygetus', 'taygetos', 'parnon', 'mountain', 'range'],
     ['eurotas', 'river', 'fertile', 'valley', 'plain', 'soil'],
     ['lakonia', 'laconia', 'peloponnes', 'gytheion', 'gythion', 'port', 'defen', 'isolat', 'protect']], 2,
    'Sparta, in Lakonia in the Peloponnese, was surrounded by mountain ranges including the Taygetus and Parnon, which acted as defences. The Eurotas River flowed through Sparta, providing fertile soil and connecting it to the port at Gytheion.'),
  short(2024, '11(b)', SPA, 3, 'How did Greek writers view Spartan society during this period?',
    ['tyrtaeus celebrated its militaristic values aristotle and plato saw a mixed constitution which plato admired while thucydides saw sparta as unchanging and later writers created the spartan mirage'],
    [['tyrtaeus', 'aristotle', 'plato', 'thucydides', 'xenophon', 'herodotus', 'plutarch'],
     ['militar', 'warrior', 'army', 'discipline', 'brave', 'courage'],
     ['mixed constitution', 'admir', 'idealis', 'unchanging', 'conservative', 'mirage', 'critic', 'negative', 'positive', 'secretive', 'bias']], 3,
    'Greek writers often emphasised Sparta’s militarism, as in Tyrtaeus’ military songs. Aristotle and Plato saw a mixed constitution, and Plato admired aspects of Spartan institutions. Athenian writers such as Thucydides saw Spartan society as unchanging. After Sparta’s collapse, writers viewed it positively, creating the “Spartan mirage”.'),
  short(2024, '11(c)', SPA, 4, 'Explain the importance of myths and legends for Spartan society during this period.',
    ['myths created a collective identity and justified the government lycurgus brought the rhetra from delphi the dioscuri justified the dual kingship and the menelaion linked sparta to the trojan war'],
    [['lycurgus', 'lykourgos', 'rhetra', 'delphi', 'oracle'],
     ['dioscuri', 'castor', 'polydeuces', 'pollux', 'twins', 'heracles', 'herakles', 'heraclid', 'helen', 'menelaus', 'menelaion', 'trojan', 'troy'],
     ['identity', 'justif', 'legitim', 'unity', 'cohesion', 'dual', 'kingship', 'ideal', 'values', 'militar']], 3,
    'Myths created a collective identity and justified the system of government. Lycurgus was a foundation myth for the Great Rhetra; Plutarch says he brought the constitution as an oracle from Delphi. The Dioscuri underpinned the dual monarchy, with symbols of the twins in the archaeology. The Trojan War myth — the Menelaion — reinforced expectations of militant men and beautiful women.'),
  short(2025, '11(a)', SPA, 3, 'Outline the role of the ekklesia in Sparta during this period.',
    ['the ekklesia was the assembly of male citizens that discussed war law and foreign policy voted on decisions elected the ephors and gerousia and approved the kings decisions but was controlled by the gerousia'],
    [['citizen', 'homoioi', 'spartiate', 'male', 'men', 'over 30', 'thirty'],
     ['vote', 'voting', 'shout', 'acclamation', 'approv', 'ratif', 'decide', 'decision', 'debate', 'discuss'],
     ['ephor', 'gerousia', 'elect'],
     ['war', 'law', 'foreign', 'peace', 'treat', 'succession']], 3,
    'The ekklesia, the general assembly and democratic element of the constitution, was a forum for matters such as war, law and foreign policy, where members could voice opinions and vote. Made up of free male citizens, it elected the ephors annually and approved the kings’ decisions (Plutarch). It was controlled by the gerousia, which had greater authority, and it elected new members of the gerousia.'),
  short(2025, '11(b)', SPA, 4, 'Explain how the Spartans controlled the helots.',
    ['the spartans used fear and violence such as the krypteia and the killing of 2000 helots recorded by thucydides kept part of the army at home and offered rewards like freedom as neodamodeis'],
    [['krypteia', 'kill', 'murder', 'violen', 'hunt', '2000', 'massacre', 'declared war'],
     ['fear', 'terror', 'humiliat', 'drunk', 'exclu', 'syssitia', 'dogskin', 'beat'],
     ['reward', 'freedom', 'freed', 'neodamodeis', 'plunder', 'sphacteria', 'promise'],
     ['army', 'soldier', 'garrison', 'home', 'revolt', 'earthquake', '465', 'messenia', 'uprising']], 3,
    'Through fear, the threat of violence and the promise of rewards. Part of the army always stayed in Sparta in case of revolt. Helots could win freedom (as neodamodeis) or a share of plunder by fighting — Thucydides on Sphacteria. They were excluded from the syssitia and, Plutarch says, forced into drunkenness. To avoid uprisings like that after the earthquake of 465 BC, the krypteia hunted and killed helots, and Thucydides records 2000 helots chosen for bravery who disappeared.'),

  /* --------------------------------- Xerxes --------------------------------- */
  own(2019, '15(a)', XER, 4, 'Describe Xerxes’ family background and status.',
    ['xerxes was the son of darius the great and atossa daughter of cyrus making him achaemenid royalty and he was chosen as heir over his older half brother artabazanes because he was born after darius became king'],
    [['darius'],
     ['atossa', 'cyrus'],
     ['achaemenid', 'teispes', 'achaemenes', 'royal', 'king of kings'],
     ['crown prince', 'heir', 'successor', 'chosen', 'artabazanes', 'older', 'born after', 'purple', 'babylon', 'satrap', 'amestris']], 3,
    'Xerxes was the son of Darius I and Atossa, daughter of Cyrus the Great, so he joined both royal lines of the Achaemenid dynasty. Herodotus says Darius chose him as heir over his older half-brother Artabazanes because Xerxes was born after Darius became king, and because of Atossa’s influence (Demaratus’ advice). As crown prince he may have served in Babylon. His wife was Amestris; their sons included Darius and Artaxerxes I.'),
  own(2020, '16(a)', XER, 3, 'Describe the manner of Xerxes’ death.',
    ['xerxes was assassinated in 465 bc in a palace conspiracy led by artabanus the commander of the royal bodyguard and his son artaxerxes succeeded him after killing his brother darius'],
    [['assassinat', 'murder', 'killed', 'stabbed', 'conspir', 'plot'],
     ['artabanus', 'aspamitres', 'mithridates', 'bodyguard', 'chiliarch', 'eunuch', 'hazarapat'],
     ['465', 'bedchamber', 'bed', 'sleep', 'artaxerxes', 'darius', 'son', 'intrigue', 'palace', 'ctesias', 'diodorus']], 3,
    'Xerxes was assassinated in 465 BC in a palace conspiracy. Greek sources (Ctesias, Diodorus, Justin) name Artabanus, commander of the royal bodyguard, helped by a eunuch (Aspamitres) — killing the king in his bedchamber. The crown prince Darius was blamed and killed by his brother Artaxerxes, who became king. A Babylonian tablet confirms the murder; the accounts differ in detail.'),
  own(2020, '16(b)', XER, 4, 'How did Xerxes administer the Persian empire?',
    ['xerxes continued darius system of satrapies governed by loyal satraps collecting tribute with the royal road and persepolis tablets showing a working bureaucracy and he crushed revolts in egypt and babylon'],
    [['satrap', 'satrapy', 'satrapies', 'provinc', 'governor'],
     ['tribute', 'tax', 'royal road', 'messenger', 'postal', 'persepolis', 'tablets', 'treasury', 'eyes and ears', 'inspector', 'bureaucra'],
     ['egypt', 'babylon', 'revolt', 'suppress', 'crushed', 'harsh'],
     ['darius', 'continued', 'built', 'building', 'gate of all nations', 'apadana', 'relatives', 'family', 'loyal']], 3,
    'Xerxes largely continued Darius’ system: satrapies run by satraps (often royal relatives or loyal nobles), regular tribute and taxation, the Royal Road and courier system, and royal inspectors (“the king’s eyes and ears”). The Persepolis Fortification and Treasury tablets show a working bureaucracy of rations and payments. He firmly suppressed revolts in Egypt (c. 486–484 BC) and Babylon (484 BC) and continued building at Persepolis (Gate of All Nations, Apadana).'),
  own(2023, '16(a)', XER, 3, 'What is the value of ONE ancient source or type of ancient source for a historian studying Xerxes?',
    ['herodotus gives the most detailed narrative of xerxes invasion of greece but it is a greek perspective written decades later that shapes xerxes as a hubristic tyrant'],
    [['herodotus', 'aeschylus', 'ctesias', 'persepolis', 'inscription', 'daiva', 'xph', 'tablet', 'relief', 'plutarch', 'diodorus', 'apadana', 'gate of all nations'],
     ['detail', 'eyewitness', 'contemporary', 'own words', 'ideology', 'official', 'insight', 'narrative', 'primary', 'persian perspective', 'persian view'],
     ['bias', 'propaganda', 'greek perspective', 'greek view', 'hubris', 'moralis', 'later', 'limit', 'exaggerat', 'one sided']], 3,
    'Herodotus’ Histories is the fullest narrative of Xerxes’ invasion of Greece: the Hellespont bridges, Thermopylae, Salamis, Plataea. Its value is limited by its Greek perspective, its writing a generation later, and its moral framework of hubris and divine punishment. Persian sources — the Persepolis inscriptions such as the “daiva” inscription (XPh) — show royal ideology in Xerxes’ own words but are propaganda that never mentions defeat. A strong answer weighs both value and limitation.'),
  own(2025, '16(a)', XER, 3, 'Describe the Persian concept of kingship.',
    ['the king ruled by the favour of ahura mazda as king of kings upholding arta or truth against the lie and his legitimacy came from achaemenid lineage'],
    [['ahura mazda', 'ahuramazda', 'divine', 'god', 'favour'],
     ['arta', 'truth', 'order', 'lie', 'drauga', 'justice', 'just'],
     ['king of kings', 'absolute', 'achaemenid', 'lineage', 'blood', 'proskynesis', 'warrior', 'inscription', 'great king']], 2,
    'The Persian king ruled “by the favour of Ahura Mazda”, as royal inscriptions repeat. He was the “King of Kings”, an absolute ruler whose legitimacy came from Achaemenid descent and divine choice. His duty was to uphold arta (truth, order) against drauga (the Lie, rebellion), and to be a just ruler and a strong warrior (Darius’ tomb inscription DNb, copied by Xerxes in XPl). Court ceremony, including proskynesis, reinforced his separation from ordinary people.'),
  own(2025, '16(b)', XER, 4, 'Explain the significance of ONE event in the career of Xerxes.',
    ['the invasion of greece in 480 bc was significant because the defeats at salamis and plataea ended persian expansion west and gave xerxes his reputation as a hubristic tyrant in greek sources'],
    [['invasion', 'salamis', 'thermopylae', 'plataea', 'athens', 'babylon', 'revolt', 'egypt', 'accession', 'hellespont', 'bridge', 'canal', 'athos', 'persepolis'],
     ['defeat', 'victory', 'burn', 'suppress', 'crushed', 'destroy', 'failed', 'won', 'reasserted', 'built'],
     ['reputation', 'legacy', 'hubris', 'turning point', 'ended', 'expansion', 'power', 'control', 'image', 'consequence', 'impact']], 3,
    'The invasion of Greece (480–479 BC): Xerxes bridged the Hellespont, cut the Athos canal, won at Thermopylae and burned Athens, but lost at Salamis, then Plataea and Mycale. It ended Persian expansion into Europe, gave Athens the confidence to build the Delian League, and created the Greek image of Xerxes as a hubristic tyrant — while Persian sources ignore it. (Other events work: suppressing the Babylonian revolt; his accession.)'),

  drill(2019, '15(b)', XER, 4, 'Assess the effectiveness of Xerxes’ reign.',
    ['xerxes reign was largely effective because he kept the empire stable crushed revolts in egypt and babylon and completed persepolis although his failed invasion of greece damaged his reputation'],
    [JUDGEMENT,
     ['stable', 'stability', 'administ', 'revolt', 'egypt', 'babylon', 'persepolis', 'building', 'tribute', 'intact', 'satrap'],
     ['greece', 'greek', 'salamis', 'plataea', 'invasion', 'defeat', 'failed', 'harem', 'intrigue', 'assassinat']], 3,
    'A strong thesis judges both sides: “Xerxes’ reign was largely effective — he held the empire together for twenty years, crushed revolts in Egypt and Babylon, and completed Persepolis — although his failed invasion of Greece and the court intrigue that ended in his murder show its limits.” Then argue each point with sources: the Persepolis tablets and inscriptions against Herodotus and Aeschylus.'),
  drill(2021, '16(b)', XER, 4, 'To what extent did Xerxes influence his time?',
    ['xerxes influenced his time to a large extent because his invasion of greece united the greeks and led to the delian league while in persia he maintained the empire and built persepolis'],

  canvas.height = Math.round(height * buildRes);

function roundedRect(ctx, x, y, w, h, r) {

  ctx.arcTo(x, y, x + w, y, rr);

  stops.forEach(([offset, colour]) => gradient.addColorStop(offset, colour));

function buildFarLayer(palette, rng, width, height) {
  const canvas = canvasOf(width, height);
  const ctx = canvas.getContext('2d');

  verticalGradient(ctx, 0, 0, width, height, [

    ctx.lineTo(cx - archW / 2, top + archW / 2);

    ctx.lineTo(cx + archW * 0.3, top + archH);

    ctx.fill();

    [0.22, palette.pipe],
    [0.38, 'rgba(255,255,255,0.22)'],
    [0.6, palette.pipe],
    [1, 'rgba(0,0,0,0.6)'],

    streak.addColorStop(0, palette.grime);
    streak.addColorStop(1, 'rgba(0,0,0,0)');

    biome,
    seed,
    palette,
    width,
    height,
    res: buildRes,
    far: buildFarLayer(palette, rng, width, height),
