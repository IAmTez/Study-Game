<title>Sewers of Study</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Sewers of Study — 16-bit UI theme
   ============================================================ */

:root {
  --ink:        #0b0f14;
  --stone-900:  #10141c;
  --stone-800:  #161c27;
  --stone-700:  #1e2633;
  --stone-600:  #2b3547;
  --stone-500:  #3d4a61;
  --stone-400:  #5b6d8a;
  --slime:      #6fd66f;
  --slime-dark: #2f7a3a;
  --sewer:      #4a7a52;
  --gold:       #f2c14e;
  --gold-dark:  #a97c1d;
  --blood:      #d1454b;
  --blood-dark: #7e1f26;
  --mana:       #5aa9e6;
  --mana-dark:  #23557f;
  --energy:     #f0a13a;
  --parchment:  #e8dbb8;
  --parchment-2:#c9b98d;
  --text:       #e8e4d8;
  --text-dim:   #97a1b0;

  --rar-common:    #b9c2cf;
  --rar-uncommon:  #63c76a;
  --rar-rare:      #4b9cf0;
  --rar-epic:      #b06fe0;
  --rar-legendary: #f2a03d;

  --px: 4px;
  /* Press Start 2P is gorgeous but extremely wide — used for body text it has
     to be tiny to fit, which is what made everything cramped. It now does
     chrome only (titles, labels, buttons, HUD); a proportional pixel face
     carries anything that is actually read. */
  --font-display: 'Press Start 2P', 'Courier New', monospace;
  --font-body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  --font: var(--font-display);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 19px;
  line-height: 1.5;
  image-rendering: pixelated;
  overflow: hidden;
}

body.reduce-motion * { animation: none !important; transition: none !important; }
body.font-large { font-size: 22px; }
body.font-small { font-size: 16px; }

#app {
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 0%, #1b2432 0%, #0b0f14 70%),
    var(--ink);
}

/* ---------- Boot ---------- */
.boot { text-align: center; }
.boot-title { font-size: 24px; color: var(--slime); letter-spacing: 2px; }
.boot-sub { margin-top: 1rem; color: var(--text-dim); }

/* ---------- Screen shell ---------- */
.screen {
  width: min(1460px, 100vw - 16px);
  height: calc(100vh - 16px);
  display: flex;
  flex-direction: column;
  position: relative;
}

.screen-scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }

/* ---------- Pixel panel ---------- */
.panel {
  background: var(--stone-800);
  border: var(--px) solid var(--stone-500);
  box-shadow:
    0 0 0 var(--px) var(--ink),
    inset 0 0 0 var(--px) var(--stone-700),
    0 8px 0 0 rgba(0,0,0,.45);
  padding: 16px;
  position: relative;
}

.panel--dark  { background: var(--stone-900); }
.panel--fill  { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.panel--flush { box-shadow: 0 0 0 var(--px) var(--ink), inset 0 0 0 var(--px) var(--stone-700); }

.panel-title {
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 0 0 12px;
  padding-bottom: 8px;
  border-bottom: var(--px) solid var(--stone-600);
}

/* ---------- Buttons ---------- */
.btn {
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--text);
  background: var(--stone-600);
  border: var(--px) solid var(--stone-400);
  box-shadow: 0 var(--px) 0 0 var(--ink), inset 0 var(--px) 0 0 rgba(255,255,255,.08);
  padding: 12px 16px;
  cursor: pointer;
  text-align: left;
  line-height: 1.5;
  transition: transform .06s steps(2), background .1s;
  display: block;
  width: 100%;
}
.btn:hover:not(:disabled) { background: var(--stone-500); transform: translateY(-2px); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible { outline: var(--px) solid var(--gold); outline-offset: 2px; }

.btn--primary { background: var(--slime-dark); border-color: var(--slime); }
.btn--primary:hover:not(:disabled) { background: #3a9349; }
.btn--danger  { background: var(--blood-dark); border-color: var(--blood); }
.btn--danger:hover:not(:disabled) { background: #9c2831; }
.btn--gold    { background: var(--gold-dark); border-color: var(--gold); color: #1a1206; }
.btn--gold:hover:not(:disabled) { background: #c8951f; }
.btn--ghost   { background: transparent; border-color: var(--stone-500); }
.btn--sm      { padding: 9px 12px; font-size: 11px; }
.btn--inline  { display: inline-block; width: auto; }
.btn--center  { text-align: center; }

.btn-sub { display: block; font-family: var(--font-body); font-size: 16px; color: var(--text-dim); margin-top: 7px; line-height: 1.45; }
.btn--gold .btn-sub { color: #4a3608; }
.btn--primary .btn-sub { color: #cfeccf; }

/* ---------- Layout helpers ---------- */
.row  { display: flex; gap: 12px; }
.col  { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; min-height: 0; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.center-x { justify-content: center; }
.center-y { align-items: center; }
.gap-sm { gap: 6px; }
.gap-lg { gap: 20px; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 12px; }
.dim { color: var(--text-dim); }
.small { font-size: 17px; }
.tiny { font-size: 15px; line-height: 1.5; }
.gold { color: var(--gold); }
.good { color: var(--slime); }
.bad  { color: var(--blood); }
.center { text-align: center; }
.hidden { display: none !important; }

/* ---------- Title screen ---------- */
.title-wrap { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.title-main {
  font-size: 34px;
  color: var(--slime);
  letter-spacing: 3px;
  text-shadow: 0 var(--px) 0 var(--slime-dark), 0 8px 0 var(--ink);
  margin: 0;
  animation: bob 3s steps(6) infinite;
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.title-sub { color: var(--gold); font-family: var(--font-display); font-size: 12px; letter-spacing: 2px; }
.title-tag { color: var(--text-dim); font-size: 18px; max-width: 620px; line-height: 1.6; }

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  width: min(640px, 100%);
}
.menu-grid .span-2 { grid-column: 1 / -1; }

/* ---------- HUD bars ---------- */
.bar {
  height: 18px;
  background: var(--stone-900);
  border: var(--px) solid var(--stone-600);
  position: relative;
  overflow: hidden;
}
.bar-fill { height: 100%; width: 0; transition: width .25s steps(8); }
.bar-fill--hp     { background: linear-gradient(var(--blood) 55%, var(--blood-dark) 55%); }
.bar-fill--energy { background: linear-gradient(var(--energy) 55%, #a4661a 55%); }
.bar-fill--xp     { background: linear-gradient(var(--mana) 55%, var(--mana-dark) 55%); }
.bar-fill--enemy  { background: linear-gradient(#c0562e 55%, #7d3419 55%); }
.bar-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000;
}
.bar--sm { height: 14px; }
.bar--sm .bar-label { font-size: 9px; }

/* ---------- Battle screen ----------
   Three fixed bands that always add up to the viewport: a slim status strip,
   the scene (which shrinks to whatever is left), and the console. Nothing here
   scrolls, so play never turns into scrolling a web page. */
.battle {
  display: flex; flex-direction: column; gap: 8px;
  height: 100%; min-height: 0;
}

.battle-top {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--stone-800);
  border: var(--px) solid var(--stone-500);
  box-shadow: 0 0 0 var(--px) var(--ink);
  padding: 8px 10px;
}

.scene-stage {
  /* basis 0, not auto: the canvas is sized *from* this box, so letting the box
     size to its content instead makes the two chase each other and the scene
     collapses to its minimum. */
  flex: 1 1 0; min-height: 190px;
  background: #05070a;
  border: var(--px) solid var(--stone-600);
  box-shadow: 0 0 0 var(--px) var(--ink), inset 0 0 40px rgba(0,0,0,.8);
  position: relative; overflow: hidden;
}
/* The backdrop is painted at full resolution, so no pixelation filter here —
   the 16x16 sprites are drawn with smoothing disabled on the canvas itself. */
#scene-canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

.battle-console {
  /* Shrinkable: on a short window the console gives way and scrolls its own
     column rather than pushing the page past the viewport. */
  flex: 0 1 auto;
  display: flex; gap: 8px; align-items: stretch;
  max-height: min(54vh, 450px); min-height: 0;
}
.battle-main {
  flex: 1 1 auto; min-width: 0; overflow-y: auto;
  display: flex; flex-direction: column;
}
/* The panel fills the console band rather than leaving a gap beneath it. */
.battle-main > .panel { flex: 1 1 auto; }
.battle-rail {
  flex: 0 0 250px; display: flex; flex-direction: column; gap: 8px;
  overflow-y: auto;
  /* Without this, a horizontally overflowing child scrolls the whole rail
     sideways — panels and all — instead of just itself. */
  overflow-x: hidden;
}

/* The control strip scrolls on its own axis, so dragging across it moves the
   buttons rather than the section beneath them. */
.rail-tabs {
  flex: 0 0 auto;
  display: flex; gap: 8px;
  overflow-x: auto; overflow-y: hidden;
  padding-bottom: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--stone-500) var(--stone-900);
  overscroll-behavior-x: contain;
}
.rail-tabs > .btn { flex: 0 0 auto; }
.rail-tabs::-webkit-scrollbar { height: 8px; }
.rail-tabs::-webkit-scrollbar-track { background: var(--stone-900); }
.rail-tabs::-webkit-scrollbar-thumb { background: var(--stone-500); }

/* Item buttons in the rail stay compact so they all fit without scrolling. */
.item-btn { padding: 8px 10px; font-size: 11px; }
.item-btn .btn-sub { font-size: 14px; margin-top: 4px; }

.hud-strip { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.hud-chip {
  background: var(--stone-900);
  border: var(--px) solid var(--stone-600);
  padding: 7px 11px; font-family: var(--font-display); font-size: 11px; white-space: nowrap;
}

.log {
  height: 116px; overflow-y: auto;
  background: var(--stone-900);
  border: var(--px) solid var(--stone-600);
  padding: 10px 12px; font-size: 16px; line-height: 1.5;
}
.log-line { color: var(--text-dim); }
.log-line--good { color: var(--slime); }
.log-line--bad  { color: var(--blood); }
.log-line--gold { color: var(--gold); }
.log-line--info { color: var(--mana); }

/* ---------- Combat ---------- */
.combat-stage {
  position: relative;
  background:
    linear-gradient(180deg, #0e1b18 0%, #0a1210 60%, #07100c 100%);
  border: var(--px) solid var(--stone-600);
  min-height: 250px;
  display: flex; align-items: flex-end; justify-content: space-around;
  padding: 20px 40px 26px;
  overflow: hidden;
}
.combat-stage::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 42px;
  background: repeating-linear-gradient(90deg, #16241f 0 16px, #12201b 16px 32px);
  border-top: var(--px) solid #223229;
}
.fighter { position: relative; z-index: 2; text-align: center; width: 210px; }
.fighter canvas { display: block; margin: 0 auto 10px; image-rendering: pixelated; }
.fighter-name { font-size: 10px; margin-bottom: 6px; }
.fighter--hit { animation: shake .3s steps(4); }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.fighter--attack { animation: lunge .3s steps(3); }
@keyframes lunge { 50% { transform: translateX(24px); } }
.fighter--attack-left { animation: lungeL .3s steps(3); }
@keyframes lungeL { 50% { transform: translateX(-24px); } }

.floater {
  position: absolute; z-index: 5;
  font-size: 16px; text-shadow: 2px 2px 0 #000;
  pointer-events: none;
  animation: float-up 1s steps(10) forwards;
}
@keyframes float-up { 0% { opacity:1; transform: translateY(0);} 100% { opacity:0; transform: translateY(-56px);} }

/* ---------- Question card ---------- */
.q-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.q-card {
  background: var(--stone-700);
  border: var(--px) solid var(--stone-500);
  padding: 10px 12px; cursor: pointer; text-align: left;
  font-family: var(--font-body); font-size: 17px; color: var(--text);
  transition: transform .08s steps(2), border-color .1s;
  display: flex; flex-direction: column; gap: 6px;
}
.q-card:hover { transform: translateY(-3px); border-color: var(--gold); }
.q-card:focus-visible { outline: var(--px) solid var(--gold); outline-offset: 2px; }
.q-card-subject { color: var(--gold); font-family: var(--font-display); font-size: 10px; }
.q-card-topic { color: var(--text-dim); font-size: 16px; line-height: 1.4; }
.q-card-meta { margin-top: auto; display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 10px; }

.q-prompt {
  font-size: 21px; line-height: 1.5; color: var(--parchment);
  background: var(--stone-900); border-left: var(--px) solid var(--gold);
  padding: 14px 18px;
}
.opt-list { display: grid; gap: 8px; margin-top: 12px; }
.opt {
  font-family: var(--font-body); font-size: 19px; line-height: 1.4;
  text-align: left; padding: 11px 14px;
  background: var(--stone-700); color: var(--text);
  border: var(--px) solid var(--stone-500); cursor: pointer;
  display: flex; gap: 12px; align-items: flex-start;
}
.opt:hover:not(:disabled) { background: var(--stone-600); border-color: var(--gold); }
.opt:disabled { cursor: not-allowed; }
.opt-key { color: var(--gold); font-family: var(--font-display); font-size: 13px; flex: 0 0 auto; padding-top: 3px; }
.opt--correct { background: var(--slime-dark); border-color: var(--slime); }
.opt--wrong   { background: var(--blood-dark); border-color: var(--blood); }
.opt--gone    { opacity: .25; text-decoration: line-through; }

.short-input {
  font-family: var(--font-body); font-size: 19px; line-height: 1.4;
  width: 100%; padding: 12px; min-height: 84px; resize: vertical;
  background: var(--stone-900); color: var(--text);
  border: var(--px) solid var(--stone-500);
}
.short-input:focus { outline: none; border-color: var(--gold); }

.explain {
  background: #14201a; border: var(--px) solid var(--sewer);
  padding: 12px 15px; font-size: 17px; line-height: 1.5; color: #cfe3cf;
}
.explain b { color: var(--slime); }

/* ---------- Inventory / items ---------- */
.inv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 10px;
}
.slot {
  aspect-ratio: 1; position: relative; cursor: pointer;
  background: var(--stone-900); border: var(--px) solid var(--stone-600);
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.slot:hover { border-color: var(--gold); }
.slot.is-selected { border-color: var(--gold); background: var(--stone-700); }
.slot canvas { image-rendering: pixelated; }
.slot-count {
  position: absolute; right: 2px; bottom: 1px;
  font-family: var(--font-display); font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000;
}
.slot-equipped { position: absolute; left: 3px; top: 2px; font-family: var(--font-display); font-size: 10px; color: var(--gold); }
.slot--empty { cursor: default; opacity: .5; }
.slot--empty:hover { border-color: var(--stone-600); }

.rar-common    { color: var(--rar-common); }
.rar-uncommon  { color: var(--rar-uncommon); }
.rar-rare      { color: var(--rar-rare); }
.rar-epic      { color: var(--rar-epic); }
.rar-legendary { color: var(--rar-legendary); }
.b-common    { border-color: var(--rar-common) !important; }
.b-uncommon  { border-color: var(--rar-uncommon) !important; }
.b-rare      { border-color: var(--rar-rare) !important; }
.b-epic      { border-color: var(--rar-epic) !important; }
.b-legendary { border-color: var(--rar-legendary) !important; box-shadow: 0 0 8px rgba(242,160,61,.4); }

/* ---------- Tables / stats ---------- */
.stat-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 9px 0; border-bottom: 2px solid var(--stone-700); font-size: 17px;
}
.stat-row:last-child { border-bottom: 0; }
.stat-row span:last-child { color: var(--gold); white-space: nowrap; }

.subject-card {
  background: var(--stone-900); border: var(--px) solid var(--stone-600);
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
}

/* ---------- Forms ---------- */
label.field { display: block; font-size: 16px; margin-bottom: 6px; color: var(--text-dim); }
input[type=text], input[type=number], select, textarea {
  font-family: var(--font-body); font-size: 18px;
  background: var(--stone-900); color: var(--text);
  border: var(--px) solid var(--stone-500); padding: 10px; width: 100%;
}
input[type=range] { width: 100%; accent-color: var(--slime); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }

.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 17px; padding: 7px 0; }
.switch input { width: 18px; height: 18px; accent-color: var(--slime); cursor: pointer; }

.dropzone {
  border: var(--px) dashed var(--stone-400);
  padding: 28px; text-align: center; color: var(--text-dim);
  font-size: 17px; line-height: 1.6; cursor: pointer; background: var(--stone-900);
}
.dropzone.is-over { border-color: var(--slime); color: var(--slime); background: #14201a; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(3,5,8,.86);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal { width: min(760px, 100%); max-height: 88vh; overflow-y: auto; }

/* ---------- Toasts ---------- */
.toasts {
  position: fixed; right: 16px; bottom: 16px; z-index: 90;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  pointer-events: none;
}
.toast {
  background: var(--stone-800); border: var(--px) solid var(--stone-500);
  padding: 11px 15px; font-size: 17px; max-width: 400px; line-height: 1.4;
  animation: toast-in .2s steps(3);
  box-shadow: 0 var(--px) 0 var(--ink);
}
.toast--good { border-color: var(--slime); }
.toast--bad  { border-color: var(--blood); }
.toast--gold { border-color: var(--gold); }
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } }

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--stone-900); }
::-webkit-scrollbar-thumb { background: var(--stone-500); border: 2px solid var(--stone-900); }
::-webkit-scrollbar-thumb:hover { background: var(--stone-400); }

/* ---------- Misc ---------- */
.divider { height: var(--px); background: var(--stone-600); margin: 12px 0; }
.kbd {
  display: inline-block; background: var(--stone-700); border: 2px solid var(--stone-500);
  padding: 3px 7px; font-family: var(--font-display); font-size: 11px; color: var(--text);
}
.pill {
  display: inline-block; padding: 4px 9px; font-family: var(--font-display); font-size: 10px;
  background: var(--stone-700); border: 2px solid var(--stone-500);
}
.pill--gold { background: var(--gold-dark); border-color: var(--gold); color: #1a1206; }
.pill--good { background: var(--slime-dark); border-color: var(--slime); }
.pill--bad  { background: var(--blood-dark); border-color: var(--blood); }

.role-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.role-card {
  background: var(--stone-800); border: var(--px) solid var(--stone-600);
  padding: 12px; cursor: pointer; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  transition: transform .08s steps(2);
}
.role-card:hover { transform: translateY(-4px); border-color: var(--gold); }
.role-card.is-selected { border-color: var(--gold); background: var(--stone-700); }
.role-card canvas { image-rendering: pixelated; }
.role-name { color: var(--gold); font-family: var(--font-display); font-size: 13px; }
.role-desc { font-size: 17px; color: var(--text-dim); line-height: 1.4; }
.role-perk { font-size: 16px; color: var(--slime); line-height: 1.4; }

/* ---------- Energy pips ---------- */
.pips { display: flex; gap: 3px; align-items: center; }
.pip {
  width: 10px; height: 18px;
  background: var(--stone-900);
  border: 2px solid var(--stone-600);
}
.pip.is-full { background: var(--energy); border-color: #ffd88a; }
.pip.is-ready { animation: pip-pulse 1.1s steps(2) infinite; }
@keyframes pip-pulse { 50% { background: #ffd88a; } }

.energy-readout {
  display: flex; align-items: center; gap: 10px;
  background: var(--stone-900);
  border: var(--px) solid var(--energy);
  padding: 6px 12px;
}
.energy-readout .label {
  font-family: var(--font-display); font-size: 11px; color: var(--energy);
}

/* ---------- Result readout ----------
   Repeating all four options after answering pushed the explanation — the part
   worth reading — off screen. Only the answer and, when wrong, the choice made
   are shown. */
.answer-row {

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value == null || value === false) continue;
    if (key === 'className') node.className = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'style' && typeof value === 'object') Object.assign(node.style, value);
    else if (key === 'dataset') Object.assign(node.dataset, value);
    else if (key.startsWith('on') && typeof value === 'function') {
      node.addEventListener(key.slice(2).toLowerCase(), value);
    } else if (key in node && typeof value !== 'object') {
      node[key] = value;
    } else {
      node.setAttribute(key, value);

  append(node, children);
  return node;

    // otherwise render a stray "0". Numbers for display always arrive via a
    // `text:` prop or a template string, so dropping a bare 0 is safe here.

}

/* localStorage wrapper. Every read is defensive: a corrupt or oversized save
   should drop the player back to the menu, never crash the game. */

const PREFIX = 'sewers-of-study:';

const KEYS = {
  save: 'save',
  settings: 'settings',
  meta: 'meta',
  custom: 'custom-subjects'
};

function load(key, fallback = null) {
  try {
    const raw = localStorage.getItem(PREFIX + key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch (err) {
    console.warn(`[storage] could not read "${key}"`, err);
    return fallback;
  }
}

function save(key, value) {
  try {
    localStorage.setItem(PREFIX + key, JSON.stringify(value));
    return true;
  } catch (err) {
    console.warn(`[storage] could not write "${key}"`, err);
    return false;
  }
}

function remove(key) {
  try { localStorage.removeItem(PREFIX + key); } catch { /* ignore */ }
}

function usageBytes() {
  let total = 0;

    for (const key of Object.keys(localStorage)) {

/* Minimal pub/sub so systems can talk without importing each other. */

const listeners = new Map();

function on(event, fn) {
  if (!listeners.has(event)) listeners.set(event, new Set());
  listeners.get(event).add(fn);
  return () => off(event, fn);
}

function off(event, fn) {
  listeners.get(event)?.delete(fn);
}

function emit(event, payload) {
  const set = listeners.get(event);
  if (!set) return;
  for (const fn of [...set]) {
    try { fn(payload); }
    catch (err) { console.error(`[bus] listener for "${event}" threw`, err); }
  }
}

   --------------------------------------------------------------- */

function xpForLevel(level) {
  return Math.floor(45 * Math.pow(level, 1.45));
}

function derived(run) {
  const role = getRole(run.roleId);
  const level = run.level;

  const stats = {
    maxHp: role.stats.maxHp + Math.round((level - 1) * role.stats.maxHp * 0.11),
    atk: role.stats.atk + Math.round((level - 1) * 1.6),
    def: role.stats.def + Math.round((level - 1) * 0.85),
    crit: role.stats.crit,
    luck: role.stats.luck,
    energyGain: role.stats.energyGain
  };

  for (const slot of ['weapon', 'armour', 'trinket']) {
    const id = run.equipped[slot];
    const item = id && getItem(id);
    if (!item?.stats) continue;
    for (const [key, value] of Object.entries(item.stats)) {
      stats[key] = (stats[key] || 0) + value;
    }
  }

  stats.maxHp = Math.max(1, Math.round(stats.maxHp));
  stats.atk = Math.max(1, Math.round(stats.atk));
  stats.def = Math.max(0, Math.round(stats.def));
  stats.maxEnergy = MAX_ENERGY;
  stats.role = role;
  return stats;
}

    run.level++;
    levelsGained.push(run.level);
    const stats = derived(run);
    run.hp = stats.maxHp;   // level up fully restores health
  }
  return { gained, levelsGained };

   --------------------------------------------------------------- */

function addItem(run, itemId, count = 1) {
  if (!ITEMS[itemId] || count <= 0) return false;
  run.inventory[itemId] = (run.inventory[itemId] || 0) + count;
  return true;
}

function removeItem(run, itemId, count = 1) {
  const have = run.inventory[itemId] || 0;
  if (have < count) return false;
  if (have === count) delete run.inventory[itemId];
  else run.inventory[itemId] = have - count;
  return true;
}

function countItem(run, itemId) {

}

function inventoryEntries(run, kind = null) {
  return Object.entries(run.inventory)
    .map(([id, count]) => ({ item: getItem(id), count }))
    .filter(entry => entry.item && (!kind || entry.item.kind === kind));

  if (!item || !['weapon', 'armour', 'trinket'].includes(item.kind)) return false;
  const previous = run.equipped[item.kind];
  if (previous === itemId) return false;
  run.equipped[item.kind] = itemId;
  const stats = derived(run);
  run.hp = Math.min(run.hp, stats.maxHp);

  return true;
}

function unequip(run, slot) {
  if (!run.equipped[slot]) return false;
  run.equipped[slot] = null;
  const stats = derived(run);
  run.hp = Math.min(run.hp, stats.maxHp);
  emit('stats:changed');
  return true;
}

/* ---------------------------------------------------------------
   Study statistics
   --------------------------------------------------------------- */

function recordAnswer(question, verdict) {
  const meta = game.meta;
  meta.questionsAnswered++;
  if (verdict === 'correct') meta.questionsCorrect++;
  if (verdict === 'partial') meta.questionsPartial++;

  const bump = (bucket, key) => {
    const entry = bucket[key] || { seen: 0, correct: 0, partial: 0 };
    entry.seen++;
    if (verdict === 'correct') entry.correct++;
    if (verdict === 'partial') entry.partial++;
    bucket[key] = entry;
  };

  bump(meta.bySubject, question.subjectId);
  bump(meta.byTopic, `${question.subjectId}::${question.topic}`);

  const history = meta.questionHistory[question.id] || { seen: 0, correct: 0, lastWrong: false };
  history.seen++;
  if (verdict === 'correct') history.correct++;
  history.lastWrong = verdict !== 'correct';
  meta.questionHistory[question.id] = history;
}

  if (!entry || !entry.seen) return 0;
  return (entry.correct + entry.partial * 0.5) / entry.seen;

    .filter(([, entry]) => entry.seen >= minSeen)
    .map(([key, entry]) => {
      const [subjectId, topic] = key.split('::');
      return { subjectId, topic, entry, accuracy: accuracy(entry) };
    })
    .sort((a, b) => a.accuracy - b.accuracy)
    .slice(0, limit);
}

  run.log = run.log || [];
  run.log.push({ text, kind });
  if (run.log.length > 120) run.log.splice(0, run.log.length - 120);
  emit('log:changed', { text, kind });
}

/* Drop rolls. Rarity is weighted, then a specific item of that rarity is
   chosen from what the current floor permits. */

/**
 * Roll a rarity. Luck shifts weight from common towards the top tiers, and
 * deeper floors do the same more gently.
 */
function rollRarity(rng, { luck = 0, floor = 1, minimum = null } = {}) {
  const depthBonus = Math.min(1.6, floor / 25);
  const entries = RARITY_ORDER.map((id, index) => {
    const base = RARITIES[id].weight;
    // index 0 = common; higher tiers gain from luck and depth.
    const boost = index === 0 ? 1 / (1 + luck * 0.8 + depthBonus * 0.35)
                              : 1 + (luck * index * 0.55) + (depthBonus * index * 0.22);
    return { id, weight: base * boost };
  });

  let chosen = rng.weighted(entries).id;
  if (minimum) {
    const floorIndex = RARITY_ORDER.indexOf(minimum);
    if (RARITY_ORDER.indexOf(chosen) < floorIndex) chosen = minimum;
  }
  return chosen;
}

/** One item drop, or null if the roll produced nothing usable. */
function rollItem(rng, { luck = 0, floor = 1, minimum = null } = {}) {

  if (!candidates.length) {
    // Nothing of that rarity is unlocked yet — step down until something is.
    for (let i = RARITY_ORDER.indexOf(rarity) - 1; i >= 0; i--) {
      const fallback = droppableItems(floor).filter(it => it.rarity === RARITY_ORDER[i]);
      if (fallback.length) return rng.pick(fallback);
    }
    return null;
  }
  return rng.pick(candidates);

 * plus a chance at a real item.

    if (rng.chance(chance * (1 + luck * 0.5))) {

    }

  const baseChance = enemy.isBoss ? 1 : 0.34;
  const rolls = (enemy.isBoss ? 2 : 1) + extraRolls;
  for (let i = 0; i < rolls; i++) {
    if (!rng.chance(baseChance * (1 + luck))) continue;
    const item = rollItem(rng, {
      luck,
      floor,
      minimum: enemy.isBoss ? (i === 0 ? 'rare' : null) : null

    if (item) drops.push({ item, count: 1 });

  // Merge duplicates so the loot readout stays short.
  const merged = new Map();
  for (const drop of drops) {
    const existing = merged.get(drop.item.id);
    if (existing) existing.count += drop.count;
    else merged.set(drop.item.id, { ...drop });
  }
  return [...merged.values()];

    if (existing) existing.count += drop.count;

  }

  poison: { name: 'Poisoned', pct: 0.045, colour: 'var(--rar-uncommon)' },

  mark:   { name: 'Marked', pct: 0, colour: 'var(--rar-epic)' },
  stun:   { name: 'Stunned', pct: 0, colour: 'var(--mana)' },

}

function applyStatus(target, id, turns) {

const { ensureFloor, currentStage, clearStage, descend, openTreasure, useShrine, isFinalStage, isBossFloor } = __require("js/game/stages.js");
const { game, derived, inventoryEntries, saveRun, saveMeta, endRun, MAX_ENERGY } = __require("js/game/state.js");
const { sfx } = __require("js/core/audio.js");

const DIFFICULTY_LABEL = ['', 'Recall', 'Basic', 'Applied', 'Analysis', 'Evaluation'];

const PLAYER_X = 300;   // offsets within a stage slot
const ENEMY_X = 810;
const PAN_MS = 1100;
const CLIMB_MS = 1500;

const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

function adventureScreen() {
  const run = game.run;
  if (!run) { go('menu'); return {}; }

  let floorState = ensureFloor(run);
  let backdrop = buildBackdrop(floorState.biome, `${run.seed}:${run.floor}`);

  const canvas = el('canvas', { id: 'scene-canvas', width: SCENE_W, height: SCENE_H });
  const ctx = canvas.getContext('2d');

  /* The scene is drawn in world units SCENE_H tall. The canvas takes whatever
     size its box has and the world is scaled to that height, so a wide window
     simply sees more of the tunnel either side rather than black bars. */
  const view = { w: SCENE_W, h: SCENE_H, k: 1 };

  function resizeCanvas() {
    const box = canvas.parentElement;
    if (!box) return;
    const w = Math.max(320, Math.floor(box.clientWidth));
    const h = Math.max(170, Math.floor(box.clientHeight));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    view.k = h / SCENE_H;
    view.h = SCENE_H;
    const previous = view.w;
    view.w = w / view.k;

    /* The console's height settles after webfonts load, which changes how much
       world fits on screen. Re-centre on the current stage whenever that
       happens, or the fighters drift toward the edges. */
    if (Math.abs(view.w - previous) > 1 && camera.mode === 'idle' && floorState) {
      camera.x = stageCam(floorState.index);
    }
  }

  /** Camera x that centres stage `i`'s slot in the current view. */
  function stageCam(i) {
    return i * SCENE_W - (view.w - SCENE_W) / 2;
  }

  const hud = el('div', { className: 'hud-strip grow' });
  const main = el('div', { className: 'col gap-sm grow' });
  const sidebar = el('div', { className: 'col gap-sm' });
  const logBox = el('div', { className: 'log' });

  /* ------------------------------------------------------------
     Scene state
     ------------------------------------------------------------ */

  const camera = { x: 0, y: 0, mode: 'idle', from: 0, to: 0, started: 0 };
  const fx = { player: { lunge: 0, shake: 0, flash: 0 }, enemy: { lunge: 0, shake: 0, flash: 0 } };
  const floaters = [];
  let combat = null;
  let raf = null;
  let banner = null;

  const stageOriginX = () => floorState.index * SCENE_W;
  const stageCamX = () => stageCam(floorState.index);

  function showBanner(text, sub = '') {
    banner = { text, sub, born: performance.now() };
  }

  /* ------------------------------------------------------------
     Drawing
     ------------------------------------------------------------ */

  function drawFighter(sprite, worldX, scale, side, time, alive = true) {
    const shake = fx[side].shake > 0 ? (Math.random() - 0.5) * 10 : 0;
    const lunge = fx[side].lunge * (side === 'player' ? 34 : -34);
    const bob = Math.sin(time * 0.0022 + (side === 'player' ? 0 : 1.7)) * 3;

    const image = spriteCanvas(sprite, scale);
    const x = Math.round(worldX - camera.x + lunge + shake - image.width / 2);
    const y = Math.round(FLOOR_Y - image.height + bob - camera.y);

    if (x < -image.width || x > view.w + image.width) return;

    // Contact shadow grounds the sprite on the walkway.
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(x + image.width / 2, FLOOR_Y - camera.y + 4, image.width * 0.34, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Reflection in the channel: the sprite flipped, faded and squashed.
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.imageSmoothingEnabled = false;
    ctx.translate(0, (FLOOR_Y - camera.y) * 2 + 16);
    ctx.scale(1, -1);
    ctx.drawImage(image, x, FLOOR_Y - camera.y - image.height);
    ctx.restore();

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    if (!alive) ctx.globalAlpha = 0.35;
    if (side === 'enemy') {
      ctx.translate(x + image.width, y);
      ctx.scale(-1, 1);
      ctx.drawImage(image, 0, 0);
    } else {
      ctx.drawImage(image, x, y);
    }
    ctx.restore();

    if (fx[side].flash > 0) {
      ctx.save();
      ctx.globalAlpha = fx[side].flash * 0.75;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(image, side === 'enemy' ? x : x, y);
      ctx.restore();
    }
  }

  /**
   * During the climb the player holds station on screen while the shaft scrolls
   * past, so they read as ascending rather than being left behind.
   */
  function drawClimbingPlayer(ladderWorldX, time) {
    const image = spriteCanvas(derived(run).role.sprite, 7);
    const x = Math.round(ladderWorldX - camera.x - image.width / 2);
    const clamber = Math.sin(time * 0.009) * 4;
    const y = Math.round(SCENE_H * 0.60 - image.height / 2 + clamber);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(image, x, y);
    ctx.restore();
  }

  /**
   * Battle info box. Each fighter's box sits on that fighter's own side —
   * player left, enemy right — so at a glance the bar you are reading clearly
   * belongs to the character beneath it.
   */
  function drawInfoBox(x, y, w, name, hp, maxHp, sub, accent, energy = null) {
    const h = energy == null ? 66 : 92;
    ctx.save();
    ctx.fillStyle = 'rgba(10,14,20,0.86)';
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#e8e4d8';
    ctx.font = '13px "Press Start 2P", monospace';
    ctx.textBaseline = 'top';
    ctx.fillText(name.length > 19 ? name.slice(0, 18) + '…' : name, x + 14, y + 12);

    if (sub) {
      ctx.fillStyle = '#97a1b0';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText(sub, x + w - 14 - ctx.measureText(sub).width, y + 15);
    }

    const barY = y + 36;
    const barW = w - 28;
    ctx.fillStyle = '#10141c';
    ctx.fillRect(x + 14, barY, barW, 13);
    const ratio = Math.max(0, Math.min(1, hp / maxHp));
    ctx.fillStyle = ratio > 0.5 ? '#63c76a' : ratio > 0.2 ? '#f0a13a' : '#d1454b';
    ctx.fillRect(x + 14, barY, Math.round(barW * ratio), 13);
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 14.5, barY + 0.5, barW - 1, 12);

    ctx.fillStyle = '#cfd6e0';
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.fillText(`${Math.ceil(hp)} / ${maxHp}`, x + 14, barY + 18);

    if (energy != null) {
      /* Energy is a small integer pool, so discrete pips read far faster than
         a continuous bar — you can count what an ability costs at a glance. */
      const eY = y + 70;
      ctx.fillStyle = '#f0a13a';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText('EN', x + 14, eY + 1);
      const pipW = 6;
      const gap = 2;
      for (let i = 0; i < MAX_ENERGY; i++) {
        const px = x + 42 + i * (pipW + gap);
        ctx.fillStyle = i < energy ? '#f0a13a' : '#1b222c';
        ctx.fillRect(px, eY, pipW, 12);
        ctx.strokeStyle = i < energy ? '#ffd88a' : '#2b3547';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, eY + 0.5, pipW - 1, 11);
      }
      ctx.fillStyle = '#e8e4d8';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText(String(energy), x + 42 + MAX_ENERGY * (pipW + gap) + 6, eY + 1);
    }
    ctx.restore();
  }

  function drawStageProp(stage, originX) {
    if (!stage) return;
    const palette = backdrop.palette;
    if (stage.kind === 'treasure') {
      const image = spriteCanvas(stage.opened ? 'chest_open' : 'chest', 5);
      const x = Math.round(originX + ENEMY_X - camera.x - image.width / 2);
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(image, x, Math.round(FLOOR_Y - image.height - camera.y));
      ctx.restore();
    } else if (stage.kind === 'shrine') {
      const image = spriteCanvas('altar', 5);
      const x = Math.round(originX + ENEMY_X - camera.x - image.width / 2);
      const y = Math.round(FLOOR_Y - image.height - camera.y);
      ctx.save();
      if (!stage.used) {
        const glow = ctx.createRadialGradient(x + image.width / 2, y + 20, 4, x + image.width / 2, y + 20, 120);
        glow.addColorStop(0, palette.light);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(x - 120, y - 100, image.width + 240, 260);
      }
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = stage.used ? 0.5 : 1;
      ctx.drawImage(image, x, y);
      ctx.restore();
    }
  }

  function drawFloaters(now) {
    ctx.save();
    ctx.font = '16px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      const age = (now - f.born) / 900;
      if (age >= 1) { floaters.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - age;
      ctx.fillStyle = '#000';
      ctx.fillText(f.text, f.x - camera.x + 2, f.y - age * 46 + 2 - camera.y);
      ctx.fillStyle = f.colour;
      ctx.fillText(f.text, f.x - camera.x, f.y - age * 46 - camera.y);
    }
    ctx.restore();
  }

  function drawBanner(now) {
    if (!banner) return;
    const age = now - banner.born;
    if (age > 2600) { banner = null; return; }
    const alpha = age < 300 ? age / 300 : age > 2200 ? (2600 - age) / 400 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(8,11,16,0.82)';
    ctx.fillRect(0, 150, view.w, banner.sub ? 76 : 54);
    ctx.strokeStyle = 'rgba(242,193,78,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 150); ctx.lineTo(view.w, 150);
    ctx.moveTo(0, 150 + (banner.sub ? 76 : 54)); ctx.lineTo(view.w, 150 + (banner.sub ? 76 : 54));
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f2c14e';
    ctx.font = '18px "Press Start 2P", monospace';
    ctx.fillText(banner.text, view.w / 2, 180);
    if (banner.sub) {
      ctx.fillStyle = '#97a1b0';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText(banner.sub, view.w / 2, 208);
    }
    ctx.restore();
  }

  function draw(now) {
    resizeCanvas();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(view.k, 0, 0, view.k, 0, 0);
    drawBackdrop(ctx, backdrop, camera.x, now, view.w, view.h, camera.y);

    // The ladder lives one slot past the final stage.
    const ladderWorldX = floorState.stages.length * SCENE_W + SCENE_W / 2;
    if (Math.abs(ladderWorldX - camera.x - SCENE_W / 2) < SCENE_W * 1.5) {
      drawLadder(ctx, backdrop.palette, ladderWorldX - camera.x, camera.y);
    }

    // Draw the current stage and its neighbour so panning shows both.
    for (let i = Math.max(0, floorState.index - 1); i <= Math.min(floorState.stages.length - 1, floorState.index + 1); i++) {
      const stage = floorState.stages[i];
      const originX = i * SCENE_W;
      if (Math.abs(originX - camera.x) > SCENE_W * 1.8) continue;
      drawStageProp(stage, originX);
      if (stage.kind === 'combat' && i === floorState.index && combat) {
        drawFighter(combat.enemy.sprite, originX + ENEMY_X, combat.enemy.isBoss ? 9 : 7, 'enemy', now, combat.enemy.hp > 0);
      } else if (stage.kind === 'combat' && !stage.cleared && stage.enemy.hp > 0) {
        drawFighter(stage.enemy.sprite, originX + ENEMY_X, stage.enemy.isBoss ? 9 : 7, 'enemy', now);
      }
    }

    if (camera.mode === 'climbing') {
      drawClimbingPlayer(ladderWorldX, now);
    } else {
      drawFighter(derived(run).role.sprite, stageOriginX() + PLAYER_X, 7, 'player', now);
    }

    const stats = derived(run);
    const boxW = 372;
    if (combat && combat.enemy.hp > 0 && camera.mode === 'idle') {
      // Enemy is on the right of the scene, so its box is too.
      drawInfoBox(view.w - boxW - 26, 22, boxW, combat.enemy.name, combat.enemy.hp, combat.enemy.maxHp,
        combat.enemy.isBoss ? 'BOSS' : '', combat.enemy.isBoss ? '#f2c14e' : '#c0562e');
      drawStatusPips(combat.enemy.statuses, view.w - boxW - 26, 92);
    }
    if (camera.mode === 'idle') {
      // Player stands on the left, so its box is bottom-left.
      drawInfoBox(26, SCENE_H - 98, boxW, stats.role.name, run.hp, stats.maxHp,
        `Lv ${run.level}`, '#63c76a', run.energy);
      drawStatusPips(run.statuses, 26, SCENE_H - 120);
    }

    drawFloaters(now);
    drawBanner(now);
  }

  function drawStatusPips(statuses, x, y) {
    const entries = Object.entries(statuses || {}).filter(([, turns]) => turns > 0);
    ctx.save();
    ctx.font = '10px "Press Start 2P", monospace';
    let offset = 0;
    for (const [id, turns] of entries) {
      const info = statusInfo(id);
      const label = `${info.name} ${turns}`;
      const w = ctx.measureText(label).width + 14;
      ctx.fillStyle = 'rgba(10,14,20,0.85)';
      ctx.fillRect(x + offset, y, w, 18);
      ctx.strokeStyle = info.colour;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + offset + 0.5, y + 0.5, w - 1, 17);
      ctx.fillStyle = info.colour;
      ctx.fillText(label, x + offset + 7, y + 12);
      offset += w + 7;
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------
     Animation loop
     ------------------------------------------------------------ */

  function tick(now) {
    for (const side of ['player', 'enemy']) {
      fx[side].lunge = Math.max(0, fx[side].lunge - 0.07);
      fx[side].shake = Math.max(0, fx[side].shake - 0.06);
      fx[side].flash = Math.max(0, fx[side].flash - 0.07);
    }

    if (camera.mode === 'panning' || camera.mode === 'climbing') {
      const progress = Math.min(1, (now - camera.started) / camera.duration);
      const eased = easeInOut(progress);
      if (camera.mode === 'panning') camera.x = camera.from + (camera.to - camera.from) * eased;
      else camera.y = camera.from + (camera.to - camera.from) * eased;
      if (progress >= 1) {
        const done = camera.onDone;
        camera.mode = 'idle';
        camera.onDone = null;
        done?.();
      }
    }

    draw(now);
    raf = requestAnimationFrame(tick);
  }

  function panTo(worldX, onDone, duration = PAN_MS) {
    camera.mode = 'panning';
    camera.from = camera.x;
    camera.to = worldX;
    camera.started = performance.now();
    camera.duration = duration;
    camera.onDone = onDone;
    setChildren(main, panel(null, el('p', { className: 'small dim center', text: 'Moving deeper…' })));
    setChildren(sidebar);
  }

  /* ------------------------------------------------------------
     Combat event playback
     ------------------------------------------------------------ */

  function floater(side, text, colour) {
    const originX = stageOriginX() + (side === 'player' ? PLAYER_X : ENEMY_X);
    floaters.push({ x: originX, y: FLOOR_Y - 110, text, colour, born: performance.now() });
  }

  function playEvents() {
    for (const event of drainEvents(combat)) {
      switch (event.type) {
        case 'attack': {
          const attacker = event.side === 'player' ? 'player' : 'enemy';
          const victim = event.side === 'player' ? 'enemy' : 'player';
          fx[attacker].lunge = 1;
          fx[victim].shake = 1;
          fx[victim].flash = 1;
          floater(victim, `-${event.amount}${event.crit ? '!' : ''}`, event.crit ? '#f2c14e' : '#ff6b6b');
          event.crit ? sfx.crit() : (event.side === 'player' ? sfx.hit() : sfx.hurt());
          break;
        }
        case 'heal':
          floater(event.side, `+${event.amount}`, '#6fd66f');
          if (event.side === 'player') sfx.heal();
          break;
        case 'energy':
          floater('player', `+${event.amount} EN`, '#f0a13a');
          break;
        case 'status-tick':
          floater(event.side, `-${event.amount}`, statusInfo(event.status).colour);
          break;
        case 'blocked':
          floater('player', 'BLOCK', '#4b9cf0');
          break;
        case 'revive':
          floater('player', 'REVIVED', '#f2c14e');
          toast(`${event.item} saves you.`, 'gold');
          sfx.levelUp();
          break;
        case 'victory': sfx.loot(); break;
        case 'defeat': sfx.death(); break;
        default: break;
      }
    }
  }

  /* ------------------------------------------------------------
     Stage lifecycle
     ------------------------------------------------------------ */

  function beginStage() {
    const stage = currentStage(run);
    combat = null;
    camera.x = stageCamX();

    if (!stage) { advance(); return; }

    if (stage.kind === 'combat') {
      combat = startCombat(run, stage.enemy);
      if (stage.enemy.isBoss) { sfx.boss(); showBanner(stage.enemy.name, stage.enemy.taunt || ''); }
      render();
    } else if (stage.kind === 'treasure') {
      renderTreasure(stage);
    } else {
      renderShrine(stage);
    }
    renderHud();
  }

  /** Clear the current stage and move on, panning as we go. */
  function advance() {
    const result = clearStage(run);
    if (result === 'next-stage') {
      panTo(stageCamX(), () => { beginStage(); });
      return;
    }
    // Floor cleared: pan to the ladder, then climb to the next floor.
    const ladderX = stageCam(floorState.stages.length);
    panTo(ladderX, () => {
      sfx.descend();
      showBanner('The way up', 'The ladder leads deeper into the system.');
      camera.mode = 'climbing';
      camera.from = 0;
      camera.to = -SCENE_H;
      camera.started = performance.now();
      camera.duration = CLIMB_MS;
      camera.onDone = () => {
        descend(run);
        floorState = ensureFloor(run);
        backdrop = buildBackdrop(floorState.biome, `${run.seed}:${run.floor}`);
        camera.x = stageCam(0);
        camera.y = 0;
        saveMeta();
        showBanner(`Floor ${run.floor}`, floorState.biomeName);
        beginStage();
      };
    });
  }

  /* ------------------------------------------------------------
     HUD and log
     ------------------------------------------------------------ */

  /**
   * The status strip. HP and XP already read clearly on the canvas boxes, so
   * this band leads with energy — the number every move decision turns on —
   * as counted pips rather than another thin bar lost among the others.
   */
  function renderHud() {
    const stats = derived(run);
    const total = floorState.stages.length;
    const cheapest = combat
      ? availableAbilities(run)
          .filter(a => !a.levelLocked && a.ability.cost > 0)
          .sort((a, b) => a.ability.cost - b.ability.cost)[0]
      : null;
    const affordable = cheapest && run.energy >= cheapest.ability.cost;

    const pips = el('div', { className: 'pips' },
      ...Array.from({ length: MAX_ENERGY }, (_, i) => el('div', {
        className: `pip ${i < run.energy ? 'is-full' : ''} ${
          affordable && i === cheapest.ability.cost - 1 ? 'is-ready' : ''}`,
      })));

    /* Two chips rather than five: on a narrow window the strip used to wrap to
       a second row and steal that height from the scene. */
    setChildren(hud,
      el('div', { className: 'hud-chip gold', text:
        `FLOOR ${run.floor}${isBossFloor(run.floor) ? ' BOSS' : ''} · ${floorState.biomeName}`
        + ` · ${Math.min(floorState.index + 1, total)}/${total}` }),
      el('div', { className: 'hud-chip', text:
        `${stats.role.name} Lv ${run.level} · ATK ${stats.atk} · DEF ${stats.def}` }),
      el('div', { className: 'energy-readout' },
        el('span', { className: 'label', text: `ENERGY ${run.energy}` }),
        pips,
        cheapest
          ? el('span', { className: 'tiny dim', text: affordable
              ? `${cheapest.ability.name} ready`
              : `${cheapest.ability.cost - run.energy} more for ${cheapest.ability.name}` })
          : null));
  }

  function renderLog() {
    const lines = (run.log || []).slice(-40);
    setChildren(logBox, ...lines.map(line =>
      el('div', { className: `log-line ${line.kind ? `log-line--${line.kind}` : ''}`, text: line.text })));
    logBox.scrollTop = logBox.scrollHeight;
  }

  /* ------------------------------------------------------------
     Non-combat stage panels
     ------------------------------------------------------------ */

  function renderTreasure(stage) {
    const body = el('div', { className: 'col gap-sm' });
    if (!stage.opened) {
      body.append(
        el('p', { className: 'small dim', text: 'A supply cache, left by whoever worked these tunnels last.' }),
        button('Open the cache', () => {
          const drops = openTreasure(run, stage);
          sfx.loot();
          renderTreasure(stage);
          toast(drops.length ? `Found ${drops.length} item${drops.length > 1 ? 's' : ''}.` : 'Empty.', drops.length ? 'gold' : '');
        }, { className: 'btn--gold btn--center' }));
    } else {
      body.append(el('p', { className: 'small good', text: 'Cache opened.' }),
        button('Move on', () => advance(), { className: 'btn--primary btn--center' }));
    }
    setChildren(main, panel('Supply cache', body));
    renderSidebar();
  }

  function renderShrine(stage) {
    const body = el('div', { className: 'col gap-sm' });
    if (!stage.used) {
      body.append(
        el('p', { className: 'small dim', text:
          'A cracked maintenance shrine. Resting here restores 45% of your health and 4 energy, and clears your afflictions.' }),
        button('Rest at the shrine', () => {
          const result = useShrine(run, stage);
          sfx.heal();
          toast(`Recovered ${result.healed} HP.`, 'good');
          renderShrine(stage);
          renderHud();
        }, { className: 'btn--primary btn--center' }));
    } else {
      body.append(el('p', { className: 'small good', text: 'You feel steadier.' }),
        button('Move on', () => advance(), { className: 'btn--primary btn--center' }));
    }
    setChildren(main, panel('Maintenance shrine', body));
    renderSidebar();
  }

  /* ------------------------------------------------------------
     Combat panels
     ------------------------------------------------------------ */

  function renderQuestionChoice() {
    if (!combat.choices.length) { renderAction(); return; }
    setChildren(main, panel('Choose your question',
      el('p', { className: 'small dim', text:
        'Harder question, heavier blow. Get it wrong and the enemy strikes instead.' }),
      el('div', { className: 'q-choices' }, ...combat.choices.map((choice, index) => {
        const q = choice.question;
        const bonus = Math.round((choice.damageBonus - 1) * 100);

    // Controls lead the rail so nothing important sits below a scroll. The
    // strip scrolls horizontally on its own rather than dragging the section.
    const controls = el('div', { className: 'rail-tabs' },
      button('Bag', () => go('inventory'), { className: 'btn--sm btn--center' }),
      button('Craft', () => go('crafting'), { className: 'btn--sm btn--center' }),

/* Crafting: spend materials (and sometimes lesser items) for something better. */

const { RECIPES } = __require("js/data/recipes.js");
const { getItem } = __require("js/data/items.js");
const { addItem, countItem, removeItem, logLine, game } = __require("js/game/state.js");

/** A recipe annotated with whether the run can currently afford it. */
function recipeStatus(run, recipe) {
  const costs = Object.entries(recipe.cost).map(([id, need]) => ({
    item: getItem(id),
    need,
    have: run ? countItem(run, id) : 0
  }));
  return {
    recipe,
    result: getItem(recipe.result),
    costs,
    craftable: !!run && costs.every(c => c.item && c.have >= c.need)
  };
}

function allRecipeStatuses(run) {
  return RECIPES.map(recipe => recipeStatus(run, recipe))
    .filter(status => status.result);
}

function craft(run, recipeId) {
  const recipe = RECIPES.find(r => r.id === recipeId);
  if (!recipe) return { ok: false, reason: 'Unknown recipe.' };

  const status = recipeStatus(run, recipe);
  if (!status.craftable) return { ok: false, reason: 'You are missing materials.' };

  for (const [id, need] of Object.entries(recipe.cost)) {
    // Removing an equipped item would leave a dangling equip reference.
    if (run.equipped.weapon === id || run.equipped.armour === id || run.equipped.trinket === id) {
      const slot = ['weapon', 'armour', 'trinket'].find(s => run.equipped[s] === id);
      if (countItem(run, id) <= need) run.equipped[slot] = null;
    }
    removeItem(run, id, need);
  }

  const amount = recipe.amount || 1;
  addItem(run, recipe.result, amount);
  game.meta.itemsFound += amount;

  const result = getItem(recipe.result);
  logLine(run, `Crafted ${result.name}${amount > 1 ? ` x${amount}` : ''}.`, 'gold');
  return { ok: true, result, amount };
}

  __exports.allRecipeStatuses = allRecipeStatuses;

        el('div', { text: '· Q&A — "Q: …" then "A: …"' }),
        el('div', { text: '· Numbered multiple choice with an "Answer: b" line' }),
        el('div', { text: '· CSV/TSV with question, answer and option columns' }),
        el('div', { text: '· JSON array of question objects' })),

      el('div', { className: 'col grow', style: { minHeight: '0' } }, subjectPanel),
      el('div', { className: 'col gap-sm', style: { flex: '0 0 420px', minHeight: '0' } },
        importPanel,

  );
